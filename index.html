/* ── Coin bubbles: happy fish release them; they float up and wait at the surface until tapped ── */
const BUBBLE_CAP=12;
function bubbleValue(f){
  const def=getDef(f);const v={common:1,uncommon:2,rare:4,super_rare:6}[def?.rarity]||1;
  return f.stage==='baby'?Math.max(1,Math.floor(v/2)):v;
}
function spawnBubble(xf,yf,v){
  if(!S.bubbles)S.bubbles=[];
  if(S.bubbles.length>=BUBBLE_CAP){const b=S.bubbles[Math.floor(Math.random()*S.bubbles.length)];b.v+=v;return;}
  S.bubbles.push({x:Math.min(0.94,Math.max(0.05,xf)),y:Math.min(0.7,Math.max(0.1,yf)),v,st:0,ph:Math.random()*6.28,ty:0.045+Math.random()*0.07});
  if(!S.hintBubble){S.hintBubble=true;toast('✨ Happy fish make coin bubbles — tap them!','ok');}
}
function collectBubble(b,W,H){
  S.bubbles=S.bubbles.filter(x=>x!==b);
  S.totalBubbles=(S.totalBubbles||0)+1;
  playCoin();coin(b.v);gameEvent('bubble');
  for(let i=0;i<10;i++)splashParticles.push({x:b.x*W,y:b.y*H,vx:(Math.random()-0.5)*3,vy:-Math.random()*2.5,life:24,color:i%2?'#FFD54F':'#E1F5FE'});
}

document.getElementById('TC').addEventListener('click',function(e){
  if(arranging())return;
  const rect=this.getBoundingClientRect();
  const cx=(e.clientX-rect.left)/rect.width*100;
  const cy=(e.clientY-rect.top)/rect.height*100;
  const pxX=(e.clientX-rect.left)*this.width/rect.width,pxY=(e.clientY-rect.top)*this.height/rect.height;
  tankRipples.push({x:pxX,y:pxY,r:0,alpha:0.5});
  if(handlePlaceTap(pxX,pxY,this.width,this.height))return;
  if(letterHit(pxX,pxY))return;
  // 1) coin bubbles first (generous touch radius)
  const bub=(S.bubbles||[]).map(b=>({b,d:Math.hypot(b.x*this.width-pxX,b.y*this.height-pxY)})).filter(o=>o.d<22).sort((a,b)=>a.d-b.d)[0];
  if(bub){collectBubble(bub.b,this.width,this.height);return;}
  if(extrasTap(pxX,pxY,this.width,this.height))return;
  let hit=false;
  fishAnim.forEach(a=>{
    if(!hit&&Math.hypot((a._cx??a.x)-cx,(a._cy??a.y)-cy)<9){
      hit=true;
      const fish=S.fish.find(f=>f.uid===a.uid);
      if(fish){petFish(fish,a);focusUid=fish.uid;if(!document.body.classList.contains('zen'))openPet(fish.uid);renderFishList();}
      const cfg=getSpeciesCfg(a.id,a.isCreature);
      const W2=this.width;const H2=this.height;
      // Shy fish flee on click
      if(cfg.social==='shy'||cfg.flees){
        const fleeDir=a.x<50?1:-1;
        a.dx=fleeDir*cfg.speedX*4;a.dy=-cfg.speedY*2;
        a.scaredTimer=90;
      }
      for(let i=0;i<8;i++)splashParticles.push({x:a.x/100*W2,y:a.y/100*H2,vx:(Math.random()-0.5)*3,vy:-Math.random()*3,life:25,color:i%3?'#B3E5FC':'#FF9EC7'});
    }
  });
  if(!hit){
    fishAnim.forEach(a=>{const f=S.fish.find(x=>x.uid===a.uid);const d=f&&getDef(f);if(d&&d.personality==='curious'&&isAwake(f)&&!a.isBenthic){const c=getSpeciesCfg(a.id,a.isCreature);a.goal={x:cx-4,y:Math.min(c.yMax,Math.max(c.yMin,cy-4)),until:Date.now()+4500,happy:true};}});
    S.clickFeed=(S.clickFeed||0)+1;if(S.clickFeed%5===0&&S.fish.length)dropFood();
  }
});

function syncAnim(){
  const ex=new Map(fishAnim.map(a=>[a.uid,a]));
  fishAnim=S.fish.map(f=>{
    const a=ex.get(f.uid);
    if(a){a.stage=f.stage;a.isCreature=!!f.isCreature;return a;}
    const cfg=getSpeciesCfg(f.id,!!f.isCreature);
    const def2=getDef(f);
    const isBenthic=!!def2?.benthic;
    const yStart=cfg.yMin+Math.random()*(cfg.yMax-cfg.yMin);
    const creatureDepth=isBenthic?([0.2,0.5,0.8][Math.floor(Math.random()*3)]):null;
    return{
      uid:f.uid,id:f.id,stage:f.stage||'adult',isCreature:!!f.isCreature,
      isBenthic,depth:creatureDepth,
      x:10+Math.random()*80,y:yStart,
      dx:(Math.random()<0.5?1:-1)*cfg.speedX,
      dy:(Math.random()-0.5)*cfg.speedY,
      wobble:Math.random()*Math.PI*2,
      poopCooldown:Math.random()*200,
      emoteTimer:0,clickAnim:0,
      idleTimer:0,
      scaredTimer:0,
      homeDecoX:null,
    };
  });
}

/* ── Pre-rendered pastel tank background (v2.5) ──────────────────────────
   Light aqua water with ordered (Bayer) dithering on the 2px grid, soft
   backdrop silhouettes, cream sand with candy pebbles (or a pale glass floor
   before gravel is bought). Painted once per size/theme and blitted.      */
const BACKDROPS=[
  {name:'Kelp',      tint:'#b9ecc0',sil:'kelp'},
  {name:'Twilight',  tint:'#e4cdfb',sil:'reef'},
  {name:'Blackwater',tint:'#f5d9b0',sil:'roots'},
  {name:'Abyss',     tint:'#96bdf0',sil:'rocks'},
];
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mixRgb(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgbStr(c){return'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}
const BAYER4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+0.5)/16);
let _bgCache={key:'',water:null,floor:null};
function getTankBG(W,H,flY){
  const theme=S.owned.backdrop?BACKDROPS[(S.backdropIdx||0)%BACKDROPS.length]:null;
  const _sp=sandPal();const key=W+'|'+H+'|'+(theme?theme.name:'-')+'|'+(S.owned.gravel?1:0)+'|'+(_sp?_sp.id:'')+'|'+(window.__WATER_ID||'');
  if(_bgCache.key===key)return _bgCache;
  const sc=ART_SC;const R=plantRng(7.3);
  // ── water
  const stops=(window.__WATER||[[0,'#d6f6f3'],[0.3,'#c4f0f0'],[0.75,'#ade6ec'],[1,'#a2e0ea']]).map(([p,c])=>[p,hexRgb(c)]);
  const sample=f=>{for(let i=1;i<stops.length;i++){if(f<=stops[i][0]){const a=stops[i-1],b=stops[i];return mixRgb(a[1],b[1],(f-a[0])/(b[0]-a[0]));}}return stops[stops.length-1][1];};
  const tint=theme?hexRgb(theme.tint):null;
  const STEPS_N=6;const pal=[];
  for(let i=0;i<=STEPS_N;i++){let c=sample(i/STEPS_N);if(tint)c=mixRgb(c,tint,0.4);pal.push(rgbStr(c));}
  const water=document.createElement('canvas');water.width=W;water.height=H;
  const wx=water.getContext('2d');
  for(let y=0;y<H;y+=sc){
    const v=Math.min(1,y/flY)*STEPS_N;
    for(let x=0;x<W;x+=sc){
      const th=BAYER4[((y/sc)&3)*4+((x/sc)&3)];
      wx.fillStyle=pal[Math.min(STEPS_N,Math.floor(v+th))];wx.fillRect(x,y,sc,sc);
    }
  }
  // far-background silhouettes for the backdrop themes (soft, behind everything)
  if(theme){
    const silC=rgbStr(mixRgb(mixRgb(sample(0.8),tint,0.6),[60,70,120],0.1));
    wx.fillStyle=silC;
    const cell=(x,y)=>wx.fillRect(Math.round(x/sc)*sc,Math.round(y/sc)*sc,sc,sc);
    if(theme.sil==='kelp'){
      for(let k=0;k<W/26;k++){const bx=k*26+R()*14;const top=flY*(0.15+R()*0.35);const ph=R()*6;
        for(let y=flY;y>top;y-=sc){const xo=Math.sin(y*0.035+ph)*7;cell(bx+xo,y);cell(bx+xo+sc,y);cell(bx+xo+sc*2,y);if(((y/sc)|0)%7===0){cell(bx+xo+sc*3,y-sc);cell(bx+xo-sc,y-sc*2);}}}
    } else if(theme.sil==='reef'){
      for(let k=0;k<W/40;k++){const bx=k*40+R()*20;const rw=18+R()*26;const rh=20+R()*46;
        for(let y=0;y<rh;y+=sc){const hw=rw*Math.sqrt(1-(y/rh)*(y/rh));for(let x=-hw;x<hw;x+=sc)cell(bx+x,flY-y);}
        if(R()<0.6){for(let y=0;y<rh*1.4;y+=sc){cell(bx+Math.sin(y*0.2)*3,flY-y);cell(bx+Math.sin(y*0.2)*3+sc,flY-y);}}}
    } else if(theme.sil==='roots'){
      for(let k=0;k<6;k++){let x=R()*W,y=0;const dir=R()<0.5?-1:1;const len=60+R()*140;
        for(let s=0;s<len;s+=sc){x+=dir*(0.4+R()*0.8);y+=sc*0.9;cell(x,y);cell(x+sc,y);cell(x+sc*2,y);if(R()<0.07){let bx=x,by=y;for(let j=0;j<20;j+=sc){bx-=dir*1.2;by+=sc*0.7;cell(bx,by);cell(bx+sc,by);}}}}
    } else {
      let y=flY*0.62;for(let x=0;x<W;x+=sc){y+=(R()-0.5)*6;y=Math.max(flY*0.4,Math.min(flY*0.85,y));for(let yy=y;yy<flY;yy+=sc)cell(x,yy);}
    }
  }
  // ── floor
  const fh=H-flY;
  const floor=document.createElement('canvas');floor.width=W;floor.height=fh;
  const fx=floor.getContext('2d');
  const g=S.owned.gravel;
  const sandTop=hexRgb(_sp?_sp.top:g?'#ffeec9':'#e3edf4'),sandBot=hexRgb(_sp?_sp.bot:g?'#f9dcae':'#cfdbe8');
  const speckD=_sp?_sp.dk:g?'#f3cf98':'#c4d2e2',speckL=_sp?_sp.lt:g?'#fff8e6':'#f1f6fa';
  for(let y=0;y<fh;y+=sc){
    const base=rgbStr(mixRgb(sandTop,sandBot,y/fh));
    for(let x=0;x<W;x+=sc){const r=R();fx.fillStyle=r<0.08?speckD:r>0.975?speckL:base;fx.fillRect(x,y,sc,sc);}
  }
  if(g){
    const pc=['#ffb6c8','#ffd68a','#bfe2ff','#d8c6ff','#bdf0d6','#ffc9a8'];
    for(let k=0;k<W/30;k++){
      const x=Math.round(R()*W/sc)*sc,y=Math.round((10+R()*(fh-16))/sc)*sc;
      const c=pc[Math.floor(R()*pc.length)];const w=(2+Math.floor(R()*2))*sc,h=(1+Math.floor(R()*2))*sc;
      const lc=ART.lineCol(hexRgb(c),'tint');
      fx.fillStyle=rgbStr(lc);fx.fillRect(x-sc,y,w+sc*2,h);fx.fillRect(x,y-sc,w,h+sc*2);
      fx.fillStyle=c;fx.fillRect(x,y,w,h);fx.fillStyle='#ffffffaa';fx.fillRect(x,y,sc,sc);
    }
  }
  // a crisp sand line where water meets the floor, with a pale highlight under it
  fx.fillStyle=g?'#efc58e':'#b8c8dc';fx.fillRect(0,0,W,sc);
  fx.fillStyle=g?'#fff6de':'#f4f8fb';fx.fillRect(0,sc,W,sc);
  _bgCache={key,water,floor};
  return _bgCache;
}

let _lastFrameMs=0;
function drawTank(){
  const canvas=document.getElementById('TC');if(!canvas)return;
  const W=Math.round((canvas.parentElement.clientWidth||640)/2)*2;
  if(canvas.width!==W)canvas.width=W;
  const H=tankH();if(canvas.height!==H)canvas.height=H;const ctx=canvas.getContext('2d');
  cancelAnimationFrame(raf);

  function frame(){
    const t=Date.now()/1000;_artBudget=2;_artFrameT0=performance.now();
    const nowMs=performance.now();const dt=Math.min(0.1,(nowMs-(_lastFrameMs||nowMs))/1000);_lastFrameMs=nowMs;
    ctx.clearRect(0,0,W,H);

    if(!S.waterAdded&&!S.waterAnim){
      ctx.fillStyle='#eef5f8';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#e2ecf2';for(let y=0;y<H;y+=12)for(let x=(y/12)%2*6;x<W;x+=12)ctx.fillRect(x,y,2,2);
      ctx.fillStyle='#a796c4';ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillText('[ EMPTY TANK ]',W/2,H/2-12);
      ctx.fillStyle='#b9abd2';ctx.font='11px monospace';
      ctx.fillText('buy equipment & add water',W/2,H/2+12);
      raf=requestAnimationFrame(frame);return;
    }

    if(S.waterAnim){
      S.waterLevel=Math.min(100,(S.waterLevel||0)+dt*24);// ~4 s to fill
      if(S.waterLevel>=100){S.waterAnim=false;S.waterAdded=true;recalcWater();sv();renderSetup();renderHUD();tutCheck();ensureDaily();updateQuestBadge();}
      ctx.fillStyle='#eef5f8';ctx.fillRect(0,0,W,H);
      const wh=Math.round(S.waterLevel/100*H/2)*2;const wy=H-wh;
      ctx.fillStyle='#bdeef0';ctx.fillRect(0,wy,W,wh);
      ctx.fillStyle='rgba(255,255,255,0.7)';
      for(let i=0;i<8;i++)ctx.fillRect(Math.round(W*0.07+i*(W*0.12)+Math.sin(t*4+i)*8),wy,Math.round(W*0.08),4);
      ctx.fillStyle='#6f8fb0';ctx.font='bold 12px monospace';ctx.textAlign='center';
      ctx.fillText('filling... '+Math.round(S.waterLevel)+'%',W/2,Math.max(20,wy-10));
      if(Math.random()<0.05)sfx('bubble');
      raf=requestAnimationFrame(frame);return;
    }

    const hourF=hourAt(Date.now());
    const isNight=isNightNow();const isDawn=hourF>=6&&hourF<8.5;const isDusk=hourF>=19&&hourF<SLEEP_FROM;
    const nightAlpha=isNight?0.34:isDawn||isDusk?0.14:0;

    const flY=Math.round(H*0.75/2)*2;
    const BG=getTankBG(W,H,flY);
    ctx.drawImage(BG.water,0,0);
    // surface shimmer
    ctx.save();ctx.globalAlpha=0.6;ctx.fillStyle='#ffffff';
    for(let i=0;i<W/30;i++){const sx=Math.round(((i*30+t*14*(i%2?1:-0.6))%W+W)%W/2)*2;ctx.fillRect(sx,0,6+(i%3)*2,2);}
    ctx.restore();

    if(S.owned.light&&!isNight){
      ctx.save();ctx.globalAlpha=0.16;
      for(let i=0;i<5;i++){const rx=W*(0.1+i*0.2)+Math.sin(t*0.25+i)*15;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(rx-14,0);ctx.lineTo(rx+14,0);ctx.lineTo(rx+55,H);ctx.lineTo(rx-55,H);ctx.closePath();ctx.fill();}
      ctx.restore();
    }

    ctx.save();ctx.globalAlpha=0.45;
    for(let i=0;i<18;i++){const cx=W*(0.02+i*0.06)+Math.sin(t*0.5+i*1.1)*8;const cy=H*0.65+Math.cos(t*0.4+i)*8;ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(cx/2)*2,Math.round(cy/2)*2,2,2);}
    ctx.restore();

    drawExtrasBack(ctx,W,H,t,flY);
    ctx.drawImage(BG.floor,0,flY);

    // Unified back-to-front render: plants + decos sorted by depth
    {
      const sandH=H-flY;
      const items=[];
      // collect plants
      (S.plantSeeds||[]).forEach(p=>items.push({type:'plant',depth:p.d||0.5,data:p}));
      // collect decos
      (S.decos||[]).forEach(d=>items.push({type:'deco',depth:d.d||0.5,data:d}));
      // sort back→front
      items.sort((a,b)=>a.depth-b.depth);

      items.forEach(item=>{
        const depth=item.depth;
        const embedY=Math.round(depth*sandH*0.55);
        const baseY=flY+embedY;

        const moving=placing&&placing.ref===item.data;
        if(moving){ctx.save();ctx.globalAlpha=0.45+0.35*Math.sin(t*8);}
        if(item.type==='plant'){
          const p=item.data;
          // root burial: sand pixels at base
          const px2=Math.round(p.x*W/2)*2;
          const _sp2=sandPal();const burialCols=_sp2?[_sp2.bot,_sp2.top,_sp2.dk]:S.owned.gravel?['#f6d29a','#ffe9bf','#efc58e']:['#c9d6e4','#dde7f0','#b8c8dc'];
          for(let i=-8;i<=8;i+=2){
            ctx.fillStyle=burialCols[Math.abs(i/2)%3];
            ctx.fillRect(px2+i,baseY,2,2+(Math.abs(i/2)%2)*2);
          }
          drawPlant(ctx,p,t,W,H,baseY);
        } else {
          const d=item.data;
          const sc=ART_SC;
          const img=decoImg(d.id,sc);
          const cx=Math.round(d.x*W/2)*2;
          const ox=cx-Math.round(img.width/4)*2;
          ctx.save();
          const shadowR=img.width*0.46;
          const sg=ctx.createRadialGradient(cx,baseY,1,cx,baseY,shadowR);
          sg.addColorStop(0,'rgba(90,100,150,0.28)');sg.addColorStop(1,'rgba(90,100,150,0)');
          ctx.fillStyle=sg;
          ctx.beginPath();ctx.ellipse(cx,baseY,shadowR,5,0,0,Math.PI*2);ctx.fill();
          drawDecoSprite(ctx,d,img,ox,baseY-img.height+sc*2,sc,t);// base sinks 2 pixels into the sand
          // a dithered sand lip over the base, so the piece sits *in* the sand
          const bw=Math.round(img.width*0.84/sc)*sc,bx=cx-Math.round(bw/2/sc)*sc;
          const _sp3=sandPal();const sandA=_sp3?[_sp3.top,_sp3.bot]:S.owned.gravel?['#ffe9bf','#f6d29a']:['#e6eef5','#cbd8e6'];
          for(let r=0;r<3;r++){const ext=r?sc:0;for(let i=-ext;i<bw+ext;i+=sc){ctx.fillStyle=sandA[((i/sc)+r+4)%2];ctx.fillRect(bx+i,baseY+(r-1)*sc,sc,sc);}}
          ctx.restore();
        }
        if(moving)ctx.restore();
      });
    }

    if(S.owned.airpump){
      const bubbleT=t;
      ctx.save();ctx.fillStyle='rgba(255,255,255,0.9)';
      for(let i=0;i<12;i++){
        const bx=W*0.04+(i%6)*14+Math.sin(bubbleT*0.5+i)*6;
        const by=flY-((bubbleT*18+i*22)%flY);
        pixBubble(ctx,bx,by,i%3===0?3:i%2===0?2:1,2);
      }
      ctx.restore();
    }

    // Volcano lava particles — depth-aware position
    if(S.decos&&S.decos.some(d=>d.id==='volcano')){
      S.decos.filter(d=>d.id==='volcano').forEach(vd=>{
        const depth=vd.d||0.5;
        const vx=Math.round(vd.x*W/2)*2;const vy=flY+Math.round(depth*(H-flY)*0.55);
        const spriteH=decoImg('volcano').height-4;
        for(let i=0;i<4;i++){const s2=i%2?2:4;ctx.fillStyle=i%2?'rgba(255,212,90,0.85)':'rgba(255,122,82,0.75)';ctx.fillRect(Math.round((vx+Math.sin(t*2+i*1.5)*6)/2)*2,Math.round((vy-spriteH-((t*22+i*14)%(spriteH*0.5)))/2)*2,s2,s2);}
      });
    }
    // Crystal shimmer
    if(S.decos&&S.decos.some(d=>d.id==='crystal')){
      S.decos.filter(d=>d.id==='crystal').forEach(cd=>{
        const depth=cd.d||0.5;const sc=ART_SC;
        const cx=Math.round(cd.x*W/2)*2;const cy=flY+Math.round(depth*(H-flY)*0.55)-Math.round(decoImg('crystal').height*0.8/2)*2;
        ctx.save();ctx.globalAlpha=0.35+Math.sin(t*2)*0.3;
        ctx.fillStyle='#ffffff';ctx.fillRect(cx-sc,cy,sc,sc*3);ctx.fillRect(cx-sc*2,cy+sc,sc*3,sc);
        ctx.fillStyle='#ffd6f2';ctx.fillRect(cx+sc*5,cy+sc*6,sc,sc);
        ctx.restore();
      });
    }

    poopParticles=poopParticles.filter(p=>{p.y+=p.vy;p.vy+=0.04;p.life--;if(p.life<=0||p.y>flY)return false;ctx.fillStyle='#b98f72';ctx.globalAlpha=p.life/80;ctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,2,2);ctx.globalAlpha=1;return true;});
    tankRipples=tankRipples.filter(r=>{r.r+=1.8;r.alpha-=0.018;if(r.alpha<=0)return false;ctx.save();ctx.globalAlpha=r.alpha;ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.restore();return true;});
    splashParticles=splashParticles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;if(p.life<=0)return false;ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life/24);ctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,2,2);ctx.globalAlpha=1;return true;});

    foodPellets=foodPellets.filter(fp=>{
      if(fp.eaten)return false;
      fp.y+=fp.vy;fp.x+=fp.vx;fp.vy+=0.0018;fp.age++;
      if(fp.y>flY/100*100-4){fp.y=flY/100*100-4;fp.vy*=-0.2;fp.vx*=0.8;}
      if(fp.age>700)return false;
      const px=Math.round(fp.x/100*W);const py=Math.round(fp.y/100*H);
      const qx=Math.round(px/2)*2,qy=Math.round(py/2)*2;
      ctx.fillStyle='#e08a3a';ctx.fillRect(qx-2,qy,6,2);ctx.fillRect(qx,qy-2,2,6);
      ctx.fillStyle='#ffc35a';ctx.fillRect(qx,qy,2,2);
      return true;
    });

    deathParticles=deathParticles.filter(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy-=0.05;p.vx*=0.97;p.life--;if(p.life<=0)return false;
      ctx.save();ctx.globalAlpha=p.life/p.maxLife;
      ctx.translate(Math.round(p.x/100*W),Math.round(p.y/100*H));
      if(p.flip){ctx.scale(-1,1);ctx.translate(-p.sp.w*p.sc,0);}
      p.sp.p.forEach(([x,y,c])=>{ctx.fillStyle=c;ctx.fillRect(x*p.sc,y*p.sc,p.sc,p.sc);});
      ctx.restore();return true;
    });

    syncAnim();
    const tags=[];
    fishAnim.forEach(a=>{
      a.wobble+=0.03;
      const fish=S.fish.find(f=>f.uid===a.uid);
      const cfg=getSpeciesCfg(a.id,a.isCreature);
      const ns=(isAwake(fish)?1:0.35)*(fish&&fish.weak?0.35:1);
      const hunger=fish?.hunger||50;

      // ── Night: all drift toward their yMax (settle down) ──
      const nightYMax=isNight?Math.min(cfg.yMax,cfg.yMin+(cfg.yMax-cfg.yMin)*0.8):cfg.yMax;
      let nightYMin=isNight?Math.max(cfg.yMin,cfg.yMin+(cfg.yMax-cfg.yMin)*0.4):cfg.yMin;
      if(fish&&fish.weak)nightYMin=Math.max(nightYMin,cfg.yMin+(cfg.yMax-cfg.yMin)*0.7);// weak fish rest near the bottom of their zone

      // ── FEEDING LAYER: filter food pellets by feedLayer ──
      let chasing=false;
      if(foodPellets.length>0&&cfg.feedLayer!=='none'){
        let nearest=null,nearestD=9999;
        foodPellets.forEach(fp=>{
          if(fp.eaten)return;
          const fpYpct=fp.y/100*100;
          // Layer gating
          if(cfg.feedLayer==='surface'&&fpYpct>30)return;
          if(cfg.feedLayer==='bottom'&&fpYpct<55)return;
          if(cfg.feedLayer==='mid'&&(fpYpct<10||fpYpct>65))return;
          const d=Math.hypot(a.x-fp.x,a.y-fpYpct);
          if(d<nearestD){nearestD=d;nearest=fp;}
        });
        if(nearest&&nearestD<70){
          const urgency=Math.max(0.4,(100-hunger)/60)*(cfg.foodMult)*ns;
          const spd=0.25*urgency;
          const ddx=nearest.x-a.x;const ddy=(nearest.y/100*100)-a.y;
          const dist=Math.hypot(ddx,ddy)||1;
          a.dx=ddx/dist*spd;a.dy=ddy/dist*spd;chasing=true;
          if(nearestD<6){
            nearest.eaten=true;
            if(fish){fish.hunger=Math.min(100,fish.hunger+(hunger<30?35:20));fish.lastFed=Date.now();fish.joy=Math.min(100,(fish.joy==null?70:fish.joy)+3);sfx('eat');sv();}
            for(let i=0;i<8;i++)splashParticles.push({x:a.x/100*W,y:a.y/100*H,vx:(Math.random()-0.5)*3,vy:-Math.random()*2.5,life:22,color:'#e08a00'});
            renderFishList();
          }
        }
      }

      if(!chasing){
        // ── SCARED TIMER: shy fish flee after click ──
        if(a.scaredTimer>0){
          a.scaredTimer--;
          // keep fleeing toward corner
        } else {
          // ── PERSONALITY TRIPS (v2.6): shy fish hide by plants and decor, playful ones chase coin bubbles,
          //    proud ones visit their favourite decoration, curious ones come to the glass when you tap it ──
          if(a.goal&&a.goal.until<t*1000)a.goal=null;
          extraGoal(a,fish,cfg,t,isNight,ns);
          if(!a.goal&&fish&&Math.random()<0.002*ns){
            const pers=(getDef(fish)||{}).personality;
            if(pers==='shy'){const spots=[...(S.decos||[]),...(S.plantSeeds||[])];if(spots.length){const sp=spots[Math.floor(Math.random()*spots.length)];a.goal={x:sp.x*100-4,y:cfg.yMin+(cfg.yMax-cfg.yMin)*0.85,until:t*1000+9000};}}
            else if(pers==='playful'&&(S.bubbles||[]).length){const b=S.bubbles[Math.floor(Math.random()*S.bubbles.length)];a.goal={x:b.x*100-4,y:Math.max(cfg.yMin,b.y*100),until:t*1000+5000,happy:true};}
            else if(pers==='proud'){const L=likesOf(fish);const dd=(S.decos||[]).find(x=>x.id===L.deco);if(dd)a.goal={x:dd.x*100-4,y:cfg.yMin+(cfg.yMax-cfg.yMin)*0.75,until:t*1000+8000,happy:true};}
          }
          if(a.goal){const gx=a.goal.x-a.x,gy=a.goal.y-a.y,gd=Math.hypot(gx,gy)||1;const gs=Math.max(0.08,cfg.speedX*1.8)*ns;if(gd>2.5){a.dx=gx/gd*gs;a.dy=gy/gd*gs*0.7;}else{a.dx*=0.85;a.dy*=0.85;}}
          else {

          // ── SOCIAL: SCHOOLING — move toward nearest same-species ──
          if(cfg.social==='schooling'&&Math.random()<0.008*ns){
            const same=fishAnim.filter(o=>o.uid!==a.uid&&o.id===a.id);
            if(same.length){
              const tgt=same[Math.floor(Math.random()*same.length)];
              const d=Math.hypot(tgt.x-a.x,tgt.y-a.y);
              if(d>12){// only pull if not already close
                a.dx+=(tgt.x-a.x)/d*0.04*ns;
                a.dy+=(tgt.y-a.y)/d*0.025*ns;
              }
            }
          }

          // ── SOCIAL: SOLITARY — betta attacks when others close ──
          if(cfg.social==='solitary'&&cfg.aggro&&Math.random()<0.002*ns){
            const others=fishAnim.filter(o=>o.uid!==a.uid&&Math.hypot(o.x-a.x,o.y-a.y)<30);
            if(others.length){
              const tgt=others[0];
              const d=Math.hypot(tgt.x-a.x,tgt.y-a.y)||1;
              a.dx=(tgt.x-a.x)/d*0.22*ns;a.dy=(tgt.y-a.y)/d*0.12*ns;
              const v=fishAnim.find(o=>o.uid===tgt.uid);
              if(v){const vc=getSpeciesCfg(v.id,v.isCreature);if(vc.flees){v.dx=-(a.x-v.x)/d*0.28*ns;v.dy=-(a.y-v.y)/d*0.14*ns;v.scaredTimer=60;}}
            }
          }

          // ── SOCIAL: ANEMONE — clownfish orbits nearest coral deco ──
          if(cfg.social==='anemone'&&S.decos&&S.decos.length){
            const coral=S.decos.find(d=>d.id==='brain_coral'||d.id==='fan_coral');
            if(coral){
              if(a.homeDecoX===null)a.homeDecoX=coral.x*100;
              const orbitR=8;const angle=t*0.8+a.wobble;
              const tx=a.homeDecoX+Math.cos(angle)*orbitR;
              const ty=cfg.yMin+(cfg.yMax-cfg.yMin)*0.6+Math.sin(angle)*4;
              a.dx+=(tx-a.x)*0.04*ns;a.dy+=(ty-a.y)*0.03*ns;
            }
          }

          // ── MOVE STYLES ──
          if(cfg.moveStyle==='cruise'){
            // Large lazy arcs — change direction very rarely
            if(Math.random()<0.001*ns){a.dx=(Math.random()<0.5?1:-1)*cfg.speedX*1.2;}
            if(Math.random()<0.0005*ns){a.dy=(Math.random()-0.5)*cfg.speedY*0.5;}
          } else if(cfg.moveStyle==='idle_burst'){
            a.idleTimer=(a.idleTimer||0)+1;
            if(a.idleTimer<80){
              // Idle: slow to stop
              a.dx*=0.92;a.dy*=0.92;
            } else if(a.idleTimer<90){
              // Burst: sudden move
              a.dx=(Math.random()<0.5?1:-1)*cfg.speedX*2.5;
              a.dy=(Math.random()-0.5)*cfg.speedY*1.5;
            } else if(a.idleTimer>110){
              a.idleTimer=0;
            }
          } else if(cfg.moveStyle==='hover'){
            // Seahorse/jellyfish: mostly vertical drift, tiny horizontal
            a.dy=Math.sin(t*0.6+a.wobble)*0.04;
            if(Math.random()<0.003*ns)a.dx=(Math.random()-0.5)*cfg.speedX*0.4;
          } else if(cfg.moveStyle==='jump'){
            // Shrimp/frog: occasional sudden burst then stop
            a.idleTimer=(a.idleTimer||0)+1;
            if(a.idleTimer>60&&Math.random()<0.03*ns){
              a.dx=(Math.random()<0.5?1:-1)*cfg.speedX*4;
              a.dy=-cfg.speedY*3;// jump up slightly
              a.idleTimer=0;
            } else {
              a.dx*=0.88;a.dy*=0.88;
            }
          } else {
            // Normal: random direction changes
            if(Math.random()<cfg.changeDir*ns){a.dx=(Math.random()-0.5)*cfg.speedX*2;}
            if(Math.random()<cfg.changeDir*0.5*ns){a.dy=(Math.random()-0.5)*cfg.speedY*2;}
          }
          }
        }
      }

      // ── PLECO special: nibble animation at bottom (wobble more) ──
      const wobbleAdd=(a.id==='pleco'&&a.y>65)?Math.sin(a.wobble*3)*0.05:Math.sin(a.wobble)*0.03;

      // ── POSITION UPDATE with layer bounds ──
      a.x+=a.dx;
      a.y+=a.dy+wobbleAdd;
      if(a.x<2){a.x=2;a.dx=Math.abs(a.dx);}
      if(a.x>93){a.x=93;a.dx=-Math.abs(a.dx);}
      if(a.y<nightYMin){a.y=nightYMin;a.dy=Math.abs(a.dy);}
      {const yCap=a.goal&&a.goal.deep?Math.max(nightYMax,a.goal.y+2):nightYMax;if(a.y>yCap){a.y=a.y-yCap>3?a.y-0.35:yCap;a.dy=-Math.abs(a.dy);}}

      // ── POOP ──
      a.poopCooldown=(a.poopCooldown||0)-1;
      const def2=getDef(fish||{id:a.id,isCreature:a.isCreature});
      if(a.poopCooldown<=0&&def2&&Math.random()<(def2.poop||0.1)*0.01){
        poopParticles.push({x:Math.round(a.x/100*W),y:Math.round(a.y/100*H),vy:0.6+Math.random()*0.5,life:80});
        S.poopLevel=Math.min(100,(S.poopLevel||0)+0.5);a.poopCooldown=160+Math.random()*220;
      }

      // ── CLICK ANIM ──
      if(a.clickAnim>0){
        a.clickAnim--;const px2=Math.round(a.x/100*W);const py2=Math.round(a.y/100*H);
        ctx.save();ctx.globalAlpha=a.clickAnim/20;ctx.strokeStyle='#ff9ec4';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(px2,py2,a.clickAnim*1.3,0,Math.PI*2);ctx.stroke();ctx.restore();
      }

      // ── DRAW SPRITE ──
      const kind=a.isCreature?'c':(a.stage==='baby'?'b':'f');
      const nf=kind==='c'?FRAMES_CRIT:FRAMES_FISH;
      // tail-beat / leg frames: quicker when swimming fast, slow at night and when weak
      const spdK=Math.min(2.2,Math.hypot(a.dx,a.dy)/Math.max(0.01,cfg.speedX)+0.35);
      a.anim=(a.anim==null?Math.random()*nf:a.anim)+dt*(kind==='c'?3.5:7)*spdK*(isAwake(fish)?1:0.4)*(fish&&fish.weak?0.5:1);
      // face: happy when petted, asleep at night, the mood while its emote shows, a blink now and then
      const moodNow=fish?getFishMood(fish):'content';
      const emoteOn=((a.emoteTimer||0)%200)<60;
      let expr='normal';
      if(a.clickAnim>0)expr='happy';
      else if(!isAwake(fish))expr='sleepy';
      else if(a.scaredTimer>0)expr='scared';
      else if(a.goal&&a.goal.happy&&Math.hypot(a.goal.x-a.x,a.goal.y-a.y)<6)expr='happy';
      else if(emoteOn&&moodNow==='hungry')expr='hungry';
      else if(emoteOn&&(moodNow==='scared'||moodNow==='warning'))expr='scared';
      else if(emoteOn&&(moodNow==='weak'||moodNow==='sleepy'))expr='sleepy';
      else if(emoteOn&&(moodNow==='happy'||moodNow==='home'||moodNow==='playful'))expr='happy';
      else if((t+(a.uid%7)*0.73)%4.2<0.14)expr='blink';
      const img=artImg(kind,a.id,expr==='normal'?Math.floor(a.anim)%nf:0,expr);
      let px,py;
      if(a.isBenthic){
        // benthic: fixed to sand surface, depth controls y position in sand area
        const sandH=H-flY;
        const embedY=Math.round((a.depth||0.5)*sandH*0.4/2)*2;
        px=Math.round(a.x/100*W/2)*2;
        py=flY+embedY-img.height+2;// sit ON sand surface
        // override y movement — only x matters
        a.y=75;// keep logic bounds happy
      } else {
        px=Math.round(a.x/100*W/2)*2;py=Math.round(a.y/100*H/2)*2;
      }
      const sp={h:img.height/ART_SC};const sc=ART_SC;
      ctx.save();ctx.translate(px,py);
      // every sprite is drawn facing left; mirror it while it swims right
      if(a.dx>0){ctx.scale(-1,1);ctx.translate(-img.width,0);}
      if(a._hideUntil>Date.now())ctx.globalAlpha=0.3;// tucked inside a decoration
      ctx.drawImage(img,0,0);
      ctx.restore();
      drawFishExtra(ctx,a,fish,px,py,img,t);
      // the fish you're looking at in the close-up wears a little bobbing heart
      if(a.uid===petUid){const bob=Math.round(Math.sin(t*4))*2;ctx.drawImage(heartCanvas('full'),px+Math.round(img.width/4)*2-9,py-20+bob,18,16);}
      // remember the sprite centre for tap detection (a.x/a.y is the top-left corner)
      a._cx=(px+img.width/2)/W*100;a._cy=(py+img.height/2)/H*100;

      // ── COIN BUBBLES: happy fish slowly fill a timer, then release a bubble ──
      if(fish&&S.waterAdded){
        if(!a.coinNext)a.coinNext=120+Math.random()*120;
        a.coinT=(a.coinT||0)+dt*fishHappy(fish)*(isNight?0.3:1);
        if(a.coinT>=a.coinNext){a.coinT=0;a.coinNext=180+Math.random()*120;/* ~1 bubble per happy fish every 4 min */spawnBubble(a._cx/100,(py-4)/H,bubbleValue(fish));}
      }
      if(a.tagT>0){a.tagT--;tags.push({x:px+img.width/2,y:py-4,name:fish?fish.name:'',em:fish?(MOOD_EMOTES[getFishMood(fish)]||''):'',a:Math.min(1,a.tagT/30)});}

      // ── MOOD EMOTE ──
      a.emoteTimer=(a.emoteTimer||0)+1;
      if(a.emoteTimer%200<60&&a.uid!==petUid&&!(isNight&&(a.uid+Math.floor(t/5))%3)){
        const mood=fish?getFishMood(fish):'content';
        const em=MOOD_EMOTES[mood]||'';
        if(em){
          const ec=mood==='hungry'?'#e08a00':mood==='scared'||mood==='warning'||mood==='weak'?'#e2456b':mood==='happy'||mood==='home'?'#ff5f9e':'#5a8fd6';
          const emoteY=py-3;
          if(!(a.tagT>0)){ctx.save();ctx.font='15px VT323, monospace';ctx.textAlign='center';ctx.lineJoin='round';
          ctx.lineWidth=3;ctx.strokeStyle='#ffffff';ctx.strokeText(em,px+img.width/2,emoteY);
          ctx.fillStyle=ec;ctx.fillText(em,px+img.width/2,emoteY);ctx.restore();}
        }
      }
    });

    if(nightAlpha>0){
      ctx.save();ctx.globalAlpha=nightAlpha;ctx.fillStyle='#3b3a8c';ctx.fillRect(0,0,W,H);ctx.restore();
      if(isNight){ctx.save();for(let i=0;i<14;i++){const tw=0.5+0.5*Math.sin(t*1.7+i*1.9);ctx.globalAlpha=0.5+0.5*tw;ctx.fillStyle='#fffbe0';const sx=Math.round(W*(0.03+((i*73)%94)*0.01)/2)*2,sy=Math.round((H*0.04+((i*37)%52)*H*0.005)/2)*2;ctx.fillRect(sx,sy,2,2);if(tw>0.8){ctx.fillRect(sx-2,sy,6,2);ctx.fillRect(sx,sy-2,2,6);}}ctx.restore();}
    }
    ctx.save();ctx.globalAlpha=0.22;ctx.fillStyle='#fff';ctx.fillRect(0,0,8,H);ctx.fillRect(W-6,0,6,H);ctx.restore();

    // ── coin bubbles (drawn above the night tint so they glow) ──
    (S.bubbles||[]).forEach(b=>{
      if(b.st===0){b.y-=0.075*dt;if(b.y<=b.ty){b.y=b.ty;b.st=1;}}
      else{b.x+=Math.sin(t*0.5+b.ph)*0.00025;b.x=Math.min(0.95,Math.max(0.05,b.x));}
      const bx=b.x*W,by=b.y*H+Math.sin(t*2+b.ph)*(b.st?2:1);
      const r=7+Math.min(5,b.v);
      const qx=Math.round(bx/2)*2,qy=Math.round(by/2)*2;
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(qx,qy,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#ffffff';ctx.fillRect(Math.round((qx-r*0.6)/2)*2,Math.round((qy-r*0.6)/2)*2,2,4);
      ctx.fillStyle='#d98200';ctx.fillRect(qx-4,qy-6,8,12);ctx.fillRect(qx-6,qy-4,12,8);
      ctx.fillStyle='#ffcc3d';ctx.fillRect(qx-4,qy-4,8,8);
      ctx.fillStyle='#fff3b8';ctx.fillRect(qx-2,qy-4,2,2);ctx.fillRect(qx-4,qy-2,2,2);
      if(b.v>1){ctx.font='13px VT323, monospace';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#ffffff';ctx.strokeText('+'+b.v,qx,qy+r+10);ctx.fillStyle='#c27a00';ctx.fillText('+'+b.v,qx,qy+r+10);}
      ctx.restore();
    });
    // ── name tags for tapped fish ──
    tags.forEach(g=>{
      const txt=g.name+(g.em?' '+g.em:'');
      ctx.save();ctx.globalAlpha=g.a;ctx.font='14px VT323, monospace';
      const tw=Math.ceil(ctx.measureText(txt).width)+12;const tx=Math.round(Math.min(W-tw-4,Math.max(4,g.x-tw/2))),ty=Math.round(Math.max(4,g.y-20));
      ctx.fillStyle='#ffffff';ctx.fillRect(tx,ty,tw,17);ctx.strokeStyle=PALC('#ff9ec4');ctx.lineWidth=2;ctx.strokeRect(tx+1,ty+1,tw-2,15);
      ctx.fillStyle=PALC('#4b3a5e');ctx.textAlign='left';ctx.fillText(txt,tx+6,ty+13);ctx.restore();
    });

    drawCalm(ctx,W,H,t);
    if(S.owned.airpump&&Math.random()<0.004)playBubble();

    raf=requestAnimationFrame(frame);
  }
  frame();
}

// One hook for everything the player does; daily tasks, tutorial and the book listen here.
function gameEvent(type,data){
  if(type==='fish'||type==='creature')sfx('happy');// a new friend!
  if(data&&data.id){
    if(type==='fish'||type==='breed')markSeen('f',data.id);
    if(type==='creature')markSeen('c',data.id);
    if(type==='plant')markSeen('p',data.id);
    if(type==='deco')markSeen('d',data.id);
  }
  dailyProg(type);
  tutEvent(type);
  updateQuestBadge();
}

/* ── Daily tasks: 3 per real calendar day ── */
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return dateStr(new Date());}
function yesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return dateStr(d);}
const DAILY_POOL=[
  {type:'feed',   txt:n=>'Feed your fish '+n+' times',  t:[2,3], r:15},
  {type:'pet',    txt:n=>'Tap your fish '+n+' times',   t:[3,5], r:15},
  {type:'bubble', txt:n=>'Collect '+n+' coin bubbles',  t:[3,5], r:25},
  {type:'clean',  txt:()=>'Clean the tank',             t:[1,1], r:20},
  {type:'water',  txt:()=>'Do a water change',          t:[1,1], r:20, ok:()=>!((S.waterReadyAt||0)>Date.now())},
  {type:'plant',  txt:()=>'Plant something new',        t:[1,1], r:20},
  {type:'mood',   txt:n=>'Get fish mood to '+n+'%',     t:[80,80],r:20, live:()=>tankMood(), ok:()=>S.fish.length>0},
  {type:'quality',txt:n=>'Get water quality to '+n+'%', t:[90,90],r:20, live:()=>avgW()},
];
function ensureDaily(){
  const d=todayStr();
  if(S.daily&&S.daily.date===d)return S.daily;
  const pool=DAILY_POOL.filter(p=>!p.ok||p.ok()).sort(()=>Math.random()-0.5).slice(0,3);
  S.daily={date:d,bonus:false,tasks:pool.map(p=>({type:p.type,target:p.t[0]+Math.floor(Math.random()*(p.t[1]-p.t[0]+1)),prog:0,reward:p.r,claimed:false}))};
  sv();return S.daily;
}
function taskText(t){const p=DAILY_POOL.find(x=>x.type===t.type);return p?p.txt(t.target):t.type;}
function dailyProg(type,abs){
  if(!S.waterAdded)return;
  const D=ensureDaily();let changed=false;
  D.tasks.forEach(t=>{
    if(t.claimed||t.prog>=t.target||t.type!==type)return;
    t.prog=abs!=null?Math.max(t.prog,Math.min(t.target,abs)):Math.min(t.target,t.prog+1);changed=true;
    if(t.prog>=t.target)toast('📋 Task done: '+taskText(t)+' — claim in 🏆 Quests','ok');
  });
  if(changed){sv();if(curQ==='daily'&&document.getElementById('s-achievements').classList.contains('v'))renderDaily();}
}
function liveDailyCheck(){
  if(!S.waterAdded||!S.daily)return;
  DAILY_POOL.filter(p=>p.live).forEach(p=>dailyProg(p.type,p.live()));
}
function claimTask(i){
  const D=ensureDaily();const t=D.tasks[i];if(!t||t.claimed||t.prog<t.target)return;
  t.claimed=true;coin(t.reward);playCoin();
  if(D.tasks.every(x=>x.claimed)&&!D.bonus){
    D.bonus=true;
    S.dailyStreak=S.dailyLastAll===yesterdayStr()?(S.dailyStreak||0)+1:(S.dailyLastAll===D.date?(S.dailyStreak||1):1);
    S.dailyLastAll=D.date;
    coin(40);toast('🌷 All done for today — thank you! +40','ok');
  }
  sv();renderDaily();updateQuestBadge();
}
function renderDaily(){
  const el=document.getElementById('q-daily');if(!el)return;
  if(!S.waterAdded){el.innerHTML='<div class="refresh-note">Finish the tank setup to unlock daily tasks.</div>';return;}
  const D=ensureDaily();
  const col=t=>t.prog>=t.target?'#22a37a':'#e08a00';
  const msLeft=(()=>{const n=new Date();const m=new Date(n);m.setHours(24,0,0,0);return m-n;})();
  el.innerHTML='<div class="refresh-note">New tasks in '+Math.floor(msLeft/3600000)+'h '+Math.floor(msLeft%3600000/60000)+'m · no rush, they wait all day</div>'
    +D.tasks.map((t,i)=>'<div class="task'+(t.claimed?' claimed':t.prog>=t.target?' done':'')+'"><div class="tk"><div class="tt">'+taskText(t)+'</div>'
      +'<div class="tr">+'+t.reward+' coins</div>'
      +'<div class="bar"><div class="fill" style="width:'+Math.round(t.prog/t.target*100)+'%;background:'+col(t)+'"></div></div></div>'
      +(t.claimed?'<span style="color:#22a37a;font-size:18px;">✓</span>':t.prog>=t.target?'<button data-claim="'+i+'">Claim</button>':'<span style="font-size:13px;color:var(--muted);">'+(t.type==='mood'||t.type==='quality'?t.prog+'%':t.prog+'/'+t.target)+'</span>')
      +'</div>').join('')
    +'<div class="streak">'+(D.bonus?'🌷 All done for today — thank you!':'🎁 A little gift when all 3 are done')+'</div>';
  el.querySelectorAll('[data-claim]').forEach(b=>b.addEventListener('click',()=>claimTask(parseInt(b.dataset.claim))));
}

const BOOK_KINDS=[

const BOOK_MILESTONES=[[10,50],[20,75],[30,100],[40,150],[51,300]];
function bookTotal(){return BOOK_KINDS.reduce((a,b)=>a+b.list().length,0);}
function bookCount(){const s=S.seen||{};return['f','c','p','d'].reduce((a,k)=>a+Object.keys(s[k]||{}).length,0);}
function markSeen(k,id){
  if(!S.seen)S.seen={f:{},c:{},p:{},d:{}};if(!S.seen[k])S.seen[k]={};
  if(S.seen[k][id])return;
  S.seen[k][id]=true;
  const n=bookCount();
  toast('📖 New in your Book! ('+n+'/'+bookTotal()+')','ok');
  if(!S.bookClaimed)S.bookClaimed=[];
  BOOK_MILESTONES.forEach(([need,rew])=>{if(n>=need&&!S.bookClaimed.includes(need)){S.bookClaimed.push(need);coin(rew);setTimeout(()=>toast('📖 Book milestone '+need+' discovered! +'+rew+' coins','ok'),600);}});
  sv();
}
let bookSel=null;
function bookCanvas(k,id,big){
  return big?fitPreview(k,id,120,80,2):fitPreview(k,id,64,44,1);
}
function silhouette(c){const x=c.getContext('2d');x.globalCompositeOperation='source-in';x.fillStyle='#cbc1df';x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='source-over';return c;}
function renderBook(){
  const el=document.getElementById('q-book');if(!el)return;

  el.innerHTML='<div class="refresh-note">Discovered '+n+' / '+T+(next?' · next reward at '+next[0]+' (+'+next[1]+' coins)':' · complete! 🎉')+'</div>'
    +'<div class="bar" style="margin-bottom:8px;"><div class="fill" style="width:'+Math.round(n/T*100)+'%;background:var(--gold)"></div></div>'
    +'<div class="book-detail" id="book-detail"><div style="font-size:14px;color:var(--muted);">Tap any entry to read about it. Shadows are still undiscovered.</div></div>'
    +BOOK_KINDS.map(K=>'<div class="bsec">'+K.name+' '+Object.keys((S.seen||{})[K.k]||{}).length+'/'+K.list().length+'</div><div class="book-grid" data-k="'+K.k+'"></div>').join('');
  BOOK_KINDS.forEach(K=>{

      const c=bookCanvas(K.k,def.id);if(!seen)silhouette(c);

      cell.addEventListener('click',()=>{bookSel=K.k+def.id;el.querySelectorAll('.bk.sel').forEach(x=>x.classList.remove('sel'));cell.classList.add('sel');showBookDetail(K.k,def,seen);});

  else{const st=TUT[S.tut];if(st.start){window._tutBubbleT=Date.now();setTimeout(st.start,300);}}

function tutCheck(){

let placing=null;// {kind:'deco'|'plant', ref, name}
function startPlacing(kind,ref,name){

function stopPlacing(){placing=null;const b=document.getElementById('place-banner');if(b)b.remove();}
// returns true if the tap was used to place something
function handlePlaceTap(pxX,pxY,W,H){
  if(!placing)return false;
  const flY=Math.round(H*0.75/2)*2;const sandH=H-flY;
  const x=Math.min(0.96,Math.max(0.04,pxX/W));
  placing.ref.x=x;
  if(placing.kind==='deco')placing.ref.d=Math.min(0.85,Math.max(0.15,(pxY-flY)/(sandH*0.55)));
  const nm=placing.name;stopPlacing();sv();
  toast('Moved '+nm+'!','ok');renderMine();
  return true;
}
function removeItem(kind,ref){
  const def=kind==='deco'?DECO_DEF.find(d=>d.id===ref.id):PLANTS_DEF.find(p=>p.id===ref.id);
  const refund=Math.floor((def?.price||0)*0.5);
  if(!confirm('Remove '+(def?.name||'item')+'? You get '+refund+' coins back.'))return;
  if(kind==='deco')S.decos=S.decos.filter(d=>d!==ref);else S.plantSeeds=S.plantSeeds.filter(p=>p!==ref);
  if(placing&&placing.ref===ref)stopPlacing();
  coin(refund);recalcWater();sv();toast((def?.name||'Item')+' removed · +'+refund+' coins','ok');
  renderMine();if(kind==='deco')renderDeco();else renderPlants();
}
function renderMine(){

function openImport(){

    +'<textarea class="save-ta" id="imp-ta" placeholder="AQ1:..."></textarea><div class="btn-row"><button class="btn" id="imp-go" style="flex:1">Load save</button><button class="btn2" id="imp-close">Cancel</button></div>');
  bg.querySelector('#imp-close').addEventListener('click',()=>bg.remove());

const HEART_PAT=['.xx.xx.','xxxxxxx','xxxxxxx','.xxxxx.','..xxx..','...x...'];
const _heart={};
function heartCanvas(kind){
  if(_heart[kind])return _heart[kind];
  const W=9,H=8,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const m=(gx,gy)=>gy>=1&&gy<=6&&gx>=1&&gx<=7&&HEART_PAT[gy-1][gx-1]==='x';
  for(let gy=0;gy<H;gy++)for(let gx=0;gx<W;gx++){
    let col=null;
    if(m(gx,gy))col=kind==='full'||(kind==='half'&&gx<=4)?'#ff6fa5':'#f6e4ee';
    else if(m(gx-1,gy)||m(gx+1,gy)||m(gx,gy-1)||m(gx,gy+1))col=kind==='empty'?'#d9bfd0':'#c2417a';
    if(col){x.fillStyle=col;x.fillRect(gx,gy,1,1);}
  }
  if(kind!=='empty'){x.fillStyle='#ffffff';x.fillRect(2,2,1,1);}
  return(_heart[kind]=c);
}
const _heartUrl={};
function heartsHTML(v){let s='';for(let i=0;i<4;i++){const r=v-i*25;const k=r>=18?'full':r>=7?'half':'empty';s+='<img class="hrt" alt="" src="'+(_heartUrl[k]||(_heartUrl[k]=heartCanvas(k).toDataURL()))+'">';}return s;}

// ── care for one fish ──
function petFish(f,a){
  const now=Date.now();
  const fresh=now-(f.lastPet||0)>8000;
  f.joy=Math.min(100,(f.joy==null?70:f.joy)+(fresh?6:1));
  if(fresh&&(f.petsToday||0)<15){f.bond=(f.bond||0)+1;f.petsToday=(f.petsToday||0)+1;}
  f.lastPet=now;
  if(isNightNow())f._wake=now+30000;// a sleepy fish wakes up for a moment
  if(a){a.clickAnim=20;}
  if(petUid===f.uid){_petFx.happyUntil=now+1600;for(let i=0;i<3;i++)_petFx.hearts.push({x:0.5+(Math.random()-0.5)*0.3,y:0.55,v:0.25+Math.random()*0.2,t:now+i*120});}
  sfx('pet');gameEvent('pet');sv();
}
function snackFish(f){
  if(S.coins<SNACK_COST){toast('Not enough coins for a snack','warn');return;}
  coin(-SNACK_COST,true);
  f.snacks=(f.snacks||0)+1;f.bond=(f.bond||0)+1;
  f.hunger=Math.min(100,f.hunger+15);f.joy=Math.min(100,(f.joy==null?70:f.joy)+12);f.lastFed=Date.now();
  if(isNightNow())f._wake=Date.now()+30000;
  _petFx.snack={t:Date.now()};sfx('snack');
  if(f.snacks>3&&!f.diseased&&!f.isCreature&&Math.random()<0.35){f.diseased=true;f.disease='bloat';toast('🍤 Too many snacks — '+f.name+' has Bloat!','bad');}
  else if(f.snacks===3)toast('3 snacks today — more may give '+f.name+' a tummy ache','warn');
  gameEvent('snack',{id:f.id});sv();renderFishList();renderPet(true);
}
function playFish(f){
  const left=PLAY_REST-(Date.now()-(f.lastPlay||0));
  if(left>0){toast(f.name+' is resting — play again in '+fmtDur(left),'warn');return;}
  const def=getDef(f)||{};
  f.lastPlay=Date.now();f.bond=(f.bond||0)+2;
  f.joy=Math.min(100,(f.joy==null?70:f.joy)+(def.personality==='playful'?35:25));
  if(isNightNow())f._wake=Date.now()+30000;
  _petFx.ball={t:Date.now()};_petFx.happyUntil=Date.now()+4200;
  sfx('play');gameEvent('play',{id:f.id});sv();renderPet(true);
}
function treatFish(f){
  const dis=f.disease?DISEASES.find(d=>d.id===f.disease):null;if(!dis)return;
  if(S.coins<dis.cureCost){toast('Not enough coins!','warn');return;}
  coin(-dis.cureCost);f.diseased=false;f.disease=null;f.health=Math.min(100,f.health+25);checkWeak(f);
  S.totalCured=(S.totalCured||0)+1;addXP(5);sv();renderFishList();toast(f.name+' is cured! 💊','ok');renderPet(true);
}

function petBg(W,H){
  if(_petBg&&_petBg.width===W&&_petBg.height===H)return _petBg;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const sc=2;
  const pal=window.__PETWATER||['#d6f6f3','#cdf3f2','#c2eff0','#b6eaee','#ade6ec'];const sandY=H-18;
  for(let y=0;y<sandY;y+=sc)for(let xx=0;xx<W;xx+=sc){const th=BAYER4[((y/sc)&3)*4+((xx/sc)&3)];x.fillStyle=pal[Math.min(4,Math.floor(y/sandY*4+th))];x.fillRect(xx,y,sc,sc);}
  const R=plantRng(3.1);
  for(let y=sandY;y<H;y+=sc)for(let xx=0;xx<W;xx+=sc){const r=R();x.fillStyle=r<0.08?'#f3cf98':r>0.97?'#fff8e6':'#ffeec9';x.fillRect(xx,y,sc,sc);}
  x.fillStyle='#efc58e';x.fillRect(0,sandY,W,sc);x.fillStyle='#fff6de';x.fillRect(0,sandY+sc,W,sc);
  return(_petBg=c);
}
function petFrame(){
  const el=document.getElementById('pet');const f=S.fish.find(x=>x.uid===petUid);
  if(!el||!f||petUid==null)return;
  const cv=el.querySelector('.ps-cv');
  const W=Math.max(120,Math.round(cv.clientWidth/2)*2),H=128;
  if(cv.width!==W)cv.width=W;
  const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  const now=Date.now(),t=now/1000;
  ctx.drawImage(petBg(W,H),0,0);
  // rising bubbles
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<5;i++){const by=H-20-((t*16+i*31)%(H-26));pixBubble(ctx,W*(0.08+i*0.21)+Math.sin(t+i)*4,by,1+(i%2),2);}
  const kind=f.isCreature?'c':(f.stage==='baby'?'b':'f');
  const d0=artData(kind,f.id,0,'normal',true);
  const sc=Math.max(2,Math.min(6,Math.floor(Math.min((W-40)/d0.w,(H-30)/d0.h))));
  const benthic=!!(getDef(f)||{}).benthic;
  const sleeping=!isAwake(f);
  // where it swims: a slow figure-eight, chasing the ball or the snack when there is one
  let tx=W/2+Math.sin(t*0.45)*W*0.22,ty=H*0.46+Math.sin(t*0.9)*6;
  if(sleeping){tx=W/2;ty=H*0.6;}
  const fx=_petFx;
  if(fx.ball&&now-fx.ball.t<4200){const k=(now-fx.ball.t)/1000;const bx=W/2+Math.sin(k*2.2)*W*0.36,by=H*0.35+Math.abs(Math.sin(k*3.1))*H*0.32;fx.ball.x=bx;fx.ball.y=by;tx=bx;ty=by;}else fx.ball=null;
  if(fx.snack){const k=(now-fx.snack.t)/1000;fx.snack.y=Math.min(H*0.5,4+k*60);fx.snack.x=W*0.5;tx=W*0.5;ty=fx.snack.y;if(k>1.6){fx.snack=null;fx.happyUntil=now+1500;}}
  if(benthic)ty=H-18-d0.h*sc/2+2;
  if(fx.px==null){fx.px=tx;fx.py=ty;}
  const ox=fx.px;fx.px+=(tx-fx.px)*0.06;fx.py+=(ty-fx.py)*0.06;
  const moving=fx.px-ox;if(Math.abs(moving)>0.15)fx.dir=moving>0?1:-1;
  // face
  const mood=getFishMood(f);let expr='normal';
  if(now<fx.happyUntil||fx.snack)expr='happy';
  else if(sleeping)expr='sleepy';
  else if(f.weak)expr='sleepy';
  else if(f.diseased||mood==='scared')expr='scared';
  else if(mood==='hungry'&&(t%5)<2)expr='hungry';
  else if((t%3.6)<0.15)expr='blink';
  const nf=kind==='c'?FRAMES_CRIT:FRAMES_FISH;
  const frame=expr==='normal'?Math.floor(t*(kind==='c'?5:(sleeping?2:8)))%nf:0;
  let d=artData(kind,f.id,frame,expr,true);
  const img=artCanvas(d,kind+':'+f.id+':'+frame+':'+expr,sc);
  const dx=Math.round((fx.px-img.width/2)/2)*2,dy=Math.round((fx.py-img.height/2)/2)*2;
  ctx.save();ctx.translate(dx,dy);if(fx.dir>0){ctx.scale(-1,1);ctx.translate(-img.width,0);}ctx.drawImage(img,0,0);ctx.restore();
  drawFishExtraAt(ctx,f,dx,dy,img,t,fx.dir>0,sc);
  // zzz while asleep
  if(sleeping){ctx.save();ctx.font='16px VT323, monospace';ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.fillStyle='#7c86c8';const k=(t%3)/3;ctx.globalAlpha=1-k;const zx=dx+img.width-6,zy=dy-4-k*14;ctx.strokeText('z',zx,zy);ctx.fillText('z',zx,zy);ctx.strokeText('Z',zx+8,zy-8);ctx.fillText('Z',zx+8,zy-8);ctx.restore();}
  // snack: a little red worm
  if(fx.snack){const sx=Math.round(fx.snack.x/2)*2-8,sy=Math.round(fx.snack.y/2)*2;for(let i=0;i<8;i++){const wy=sy+(Math.round(Math.sin(t*12+i*0.9))*2);ctx.fillStyle='#b8366c';ctx.fillRect(sx+i*2,wy-2,2,6);ctx.fillStyle=i===0?'#ffd0dc':'#ff6f8f';ctx.fillRect(sx+i*2,wy,2,2);}}
  // ball: a pixel beach ball
  if(fx.ball){const bx=Math.round(fx.ball.x/2)*2-8,by=Math.round(fx.ball.y/2)*2-8;const BALL=['..oooo..','.oPPWWo.','oPPPWWWo','oPPPWWWo','oYYYCCCo','oYYYCCCo','.oYYCCo.','..oooo..'];const BC={o:'#7a4f8f',P:'#ff6fa5',W:'#ffffff',Y:'#ffd04a',C:'#6fdcec'};BALL.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch!=='.'){ctx.fillStyle=BC[ch];ctx.fillRect(bx+i*2,by+j*2,2,2);}}));ctx.fillStyle='#ffffff';ctx.fillRect(bx+4,by+4,2,2);}
  // floating hearts
  const hc=heartCanvas('full');
  fx.hearts=fx.hearts.filter(h=>{const age=(now-h.t)/1000;if(age<0)return true;if(age>1.4)return false;ctx.save();ctx.globalAlpha=Math.min(1,1.6-age);const hx=Math.round((fx.px+(h.x-0.5)*img.width)/2)*2,hy=Math.round((fx.py-img.height*0.4-age*30)/2)*2;ctx.drawImage(hc,hx,hy,18,16);ctx.restore();return true;});
  // night tint
  if(isNightNow()){ctx.save();ctx.globalAlpha=0.28;ctx.fillStyle='#3b3a8c';ctx.fillRect(0,0,W,H);ctx.restore();}
  _petRaf=requestAnimationFrame(petFrame);
}

/* ═══════════════════════════════════════════════════════════
   GAME LOOP — real-clock time (v2.6)
   The tank follows the phone's clock, like a Tamagotchi: fish sleep from 22:00
   to 07:00, ages count real days and hours, hunger and happiness change by the
   hour, and a new calendar day brings a morning gift. Time away is simulated
   gently (up to two days) so nobody comes back to a disaster.
═══════════════════════════════════════════════════════════ */
let lastTickTime=Date.now();
const HOUR=3600000,DAYMS=86400000;
const GROW_MS=24*HOUR;              // babies grow up after one real day
const OFFLINE_CAP_MS=48*HOUR;       // at most two days are simulated while away
const SLEEP_FROM=22,SLEEP_TO=7;     // bedtime and wake-up time (phone clock)
function hourAt(ts){const d=new Date(ts);return d.getHours()+d.getMinutes()/60;}
function isNightAt(ts){const h=hourAt(ts);return h>=SLEEP_FROM||h<SLEEP_TO;}
function isNightNow(){return isNightAt(Date.now());}
function isAwake(f){return !isNightNow()||(f&&f._wake>Date.now());}
function ageMs(f){return Math.max(0,Date.now()-(f.born||Date.now()));}
function fmtDur(ms){const d=Math.floor(ms/DAYMS),h=Math.floor(ms%DAYMS/HOUR),m=Math.floor(ms%HOUR/60000);return d?d+'d '+h+'h':h?h+'h '+m+'m':Math.max(1,m)+'m';}
function ageText(f){const ms=ageMs(f);return ms<60000?'newborn':fmtDur(ms);}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/DAYMS);}

// how fast needs drop, per hour (asleep fish barely get hungry or bored)
function needRates(f,night){
  const def=getDef(f)||{};
  let hr=night?3:9;if(def.personality==='greedy')hr*=1.3;
  let jr=night?1:5;if(likesInTank(f))jr*=0.5;
  if(def.social==='schooling'&&!S.fish.some(x=>x.id===f.id&&x.uid!==f.uid))jr*=1.5;
  return{hr,jr};
}
// Advance the world by ms of real time ending now. Needs drift smoothly; hourly and daily events fire as their boundaries pass.
function advanceReal(ms,gentle){
  const end=Date.now();let t=end-Math.max(0,ms);
  while(t<end){
    const step=Math.min(end-t,10*60000);const hrs=step/HOUR;const night=isNightAt(t+step/2);
    if(S.waterAdded){
      S.fish.forEach(f=>{
        const r=needRates(f,night);
        f.hunger=Math.max(0,f.hunger-r.hr*hrs*(gentle?0.8:1));
        f.joy=Math.max(likesInTank(f)?35:0,(f.joy==null?70:f.joy)-r.jr*hrs);
      });
      S.poopLevel=Math.max(0,S.poopLevel-(S.owned.filter2?1:S.owned.filter?0.5:0)*hrs);
    }
    const ledMult=S.owned.light?1:0.15,co2Mult=S.owned.co2?1.5:1;S.plantAge+=hrs*2*ledMult*co2Mult;
    const h0=Math.floor(t/HOUR),h1=Math.floor((t+step)/HOUR);
    t+=step;
    for(let h=h0;h<h1;h++)onHour(gentle,(h+1)*HOUR);
  }
  if(S.waterAdded)recalcWater();
  const today=todayStr();
  if(!S.lastDate)S.lastDate=today;
  if(S.lastDate!==today){const n=Math.max(1,daysBetween(S.lastDate,today));S.lastDate=today;S.day=(S.day||1)+n;onNewDay(gentle,n);}
}

// Offline / long-background catch-up. Instead of a bill, the time away becomes a few small moments (see openingFlow).
function catchUp(realMs,isOpen){
  if(!S.waterAdded){advanceReal(Math.min(realMs,OFFLINE_CAP_MS),true);return;}
  const ms=Math.min(realMs,OFFLINE_CAP_MS);
  const coins0=S.coins,uid0=S.uid||0,babies0=S.fish.filter(f=>f.stage==='baby').map(f=>f.uid);
  _quietToasts=[];
  advanceReal(ms,true);
  // fish keep making bubbles while you're away (awake hours only), at 20% of the live rate
  let found=0,awakeMs=0;for(let t=Date.now()-ms;t<Date.now();t+=10*60000)if(!isNightAt(t))awakeMs+=Math.min(10*60000,Date.now()-t);
  S.fish.forEach(f=>{found+=fishHappy(f)*bubbleValue(f)*(awakeMs/1000)/240*0.2;});
  found=Math.floor(found);
  if(found>0)coin(found,true);
  _quietToasts=null;
  renderHUD();renderFishList();
  const away={ms:realMs,coins:S.coins-coins0,bubbles:found,nightMostly:awakeMs<ms*0.5,
    born:S.fish.filter(f=>f.uid>uid0).map(f=>({uid:f.uid,name:f.name,species:(getDef(f)||{}).name||'fish'})),
    grew:S.fish.filter(f=>babies0.includes(f.uid)&&f.stage==='adult').map(f=>({uid:f.uid,name:f.name})),
    plantsGrew:(S.plantSeeds||[]).length>0&&ms>4*HOUR};
  extraAway(away,ms);
  if(isOpen||realMs>=20*60000)openingFlow(away);
}

function updateClock(){
  const d=new Date();
  document.getElementById('time-display').textContent='Day '+S.day+' · '+(isNightNow()?'🌙 ':'☀ ')+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function gameLoop(){
  const now=Date.now();const realMs=now-lastTickTime;lastTickTime=now;
  if(realMs>90000){catchUp(realMs);}// tab was in the background for a while
  else advanceReal(realMs,false);
  updateClock();
  renderHUD();liveDailyCheck();tutCheck();if(petUid!=null)renderPet();
  if(SND.sfx&&isNightNow()&&Math.random()<0.006)sfx('night');// a rare soft chime at night
  soundTick();checkCall();calmTick();
  if(now-(S.lastSeen||0)>15000)sv();// save every ~15s so lastSeen stays fresh
  setTimeout(gameLoop,500);
}

let _lastCall=0;
function checkCall(){
  if(isNightNow()||!S.waterAdded)return;
  const h=S.fish.find(f=>f.hunger<25||f.weak);
  if(h&&Date.now()-_lastCall>15*60000){_lastCall=Date.now();sfx('call');}
}
function checkWeak(f){
  if(!f.weak&&f.health<=15){f.weak=true;S.totalWeak=(S.totalWeak||0)+1;showAl('global','💚 '+f.name+' is weak — feed them and keep the water clean','warn');}
  else if(f.weak&&f.health>=35){f.weak=false;S.totalRecovered=(S.totalRecovered||0)+1;showAl('global','💚 '+f.name+' is feeling better!','ok');}
}
// Hourly care check. gentle=true while catching up offline: no new disease, health never drops below 25, no deaths.
function onHour(gentle,ts){
  const floorHP=gentle?25:5;const night=isNightAt(ts-1);
  S.fish.forEach(f=>{
    if(f.hunger>=60&&!f.diseased&&avgW()>=60)f.health=Math.min(100,f.health+6);// well cared-for fish heal over time
    if(f.hunger<20)f.health=Math.max(Math.min(f.health,floorHP),f.health-5);
    if(!gentle&&!f.isCreature&&avgW()<40&&!f.diseased&&Math.random()<0.02){
      const dis=DISEASES[Math.floor(Math.random()*DISEASES.length)];f.diseased=true;f.disease=dis.id;f.disSince=ts;showAl('global','🤒 '+f.name+' feels a little under the weather — clean water helps','warn');
    }
    if(f.diseased){
      const dis=DISEASES.find(d=>d.id===f.disease);if(dis)f.health=Math.max(Math.min(f.health,floorHP),f.health-dis.damage/8);
      if(!f.disSince)f.disSince=ts;
      if(avgW()>=60&&ts-f.disSince>=10*HOUR){f.diseased=false;f.disease=null;f.disSince=null;showAl('global','💚 '+f.name+' feels better!','ok');}
    }
    f.health=Math.round(f.health);
    if(f.stage==='baby'&&ts-(f.born||ts)>=GROW_MS){f.stage='adult';showAl('global','🎉 '+f.name+' is all grown up!','ok');addXP(5);if(!gentle)sfx('grow');}
    f.age=Math.floor(Math.max(0,ts-(f.born||ts))/DAYMS);
    checkWeak(f);
  });
  // babies are born in the daytime
  if(!night){
    const groups={};S.fish.forEach(f=>{groups[f.id]=groups[f.id]||[];groups[f.id].push(f);});
    Object.keys(groups).forEach(id=>{
      const cat=FISH_DEF.find(c=>c.id===id);if(!cat||!cat.breedable||groups[id].filter(f=>f.stage==='adult'&&!f.weak).length<2||avgW()<75)return;
      if(Math.random()<0.03&&S.fish.length<getTankCap()){const name=NAMES[Math.floor(Math.random()*NAMES.length)];S.fish.push({id,name,health:100,hunger:100,joy:80,age:0,born:ts,stage:'baby',diseased:false,disease:null,uid:++S.uid});S.totalBred=(S.totalBred||0)+1;showAl('global','🥚 Baby '+cat.name+' ('+name+') was born!','ok');if(!gentle)sfx('happy');addXP(10);gameEvent('breed',{id});}
    });
  }
  sv();if(!gentle)renderFishList();checkAch();
}
// A new calendar day: morning gift, daily counters reset
function onNewDay(gentle,n){
  n=n||1;
  if(S.fish.length){coin(30,!!gentle);addXP(5);showAl('global','☀ Good morning! New day — +30 coins','ok');}
  S.fish.forEach(f=>{f.snacks=0;f.petsToday=0;});
  const anyWeak=S.fish.some(f=>f.weak);
  if(!anyWeak&&S.fish.length>0){S.daysWithoutDeath=(S.daysWithoutDeath||0)+n;if(S.daysWithoutDeath>(S.maxDaysWithoutDeath||0))S.maxDaysWithoutDeath=S.daysWithoutDeath;}else if(anyWeak)S.daysWithoutDeath=0;
  sv();if(!gentle)renderFishList();checkAch();
}

/* ── speech: a little bubble above a fish ── */
let _speech=null;// {uid,text,until}
function say(f,text,ms){
  if(!f)return;
  _speech={uid:f.uid,text,dur:ms||5500,t0:0,until:0};// the clock starts when it's first on screen
}
function drawSpeech(ctx,W,H){
  if(!_speech)return;
  const a=fishAnim.find(x=>x.uid===_speech.uid);if(!a||a._cx==null)return;
  if(!_speech.t0){_speech.t0=Date.now();_speech.until=_speech.t0+_speech.dur;}
  if(Date.now()>_speech.until){_speech=null;return;}
  const fade=Math.min(1,(_speech.until-Date.now())/500,(Date.now()-_speech.t0)/250);
  ctx.save();ctx.globalAlpha=Math.max(0,fade);ctx.font='15px VT323, monospace';
  const tw=Math.ceil(ctx.measureText(_speech.text).width)+14;const th=20;
  const fx=a._cx/100*W,fy=a._cy/100*H;
  // above the fish, or below it when the fish is near the surface (so nothing at the top of the screen covers it)
  const below=fy-46<30;
  let bx=Math.round(Math.min(W-tw-4,Math.max(4,fx-tw/2))/2)*2,by=Math.round((below?fy+26:fy-46)/2)*2;
  ctx.fillStyle='#ffffff';ctx.fillRect(bx,by,tw,th);
  ctx.fillStyle=PALC('#ff9ec4');ctx.fillRect(bx,by-2,tw,2);ctx.fillRect(bx,by+th,tw,2);ctx.fillRect(bx-2,by,2,th);ctx.fillRect(bx+tw,by,2,th);
  const tx=Math.round(Math.min(bx+tw-12,Math.max(bx+6,fx))/2)*2;
  if(!below){ctx.fillStyle='#ffffff';ctx.fillRect(tx,by+th,6,2);ctx.fillRect(tx+2,by+th+2,2,2);
    ctx.fillStyle=PALC('#ff9ec4');ctx.fillRect(tx-2,by+th+2,2,2);ctx.fillRect(tx+4,by+th+2,4,2);ctx.fillRect(tx+2,by+th+4,2,2);}
  else{ctx.fillStyle='#ffffff';ctx.fillRect(tx,by-2,6,2);ctx.fillRect(tx+2,by-4,2,2);
    ctx.fillStyle=PALC('#ff9ec4');ctx.fillRect(tx-2,by-4,2,2);ctx.fillRect(tx+4,by-4,4,2);ctx.fillRect(tx+2,by-6,2,2);}
  ctx.fillStyle=PALC('#4b3a5e');ctx.textAlign='left';ctx.fillText(_speech.text,bx+7,by+15);
  ctx.restore();
}

/* ── opening ritual ── */
function greet(away){
  const f=starFish();if(!f)return;
  const night=isNightNow();const h=hourAt(Date.now());
  let key=night?'night':away>2*DAYMS?'long':h<10?'morning':h<18?'day':'evening';
  if(!S.tutDone&&(S.tut||0)===0&&!S._greeted)key='first';
  S._greeted=true;
  if(night)f._wake=Date.now()+9000;
  // everyone who's awake swims over to the glass for a moment
  fishAnim.forEach(a=>{const g=S.fish.find(x=>x.uid===a.uid);if(!g||!isAwake(g)||a.isBenthic)return;const c=getSpeciesCfg(a.id,a.isCreature);a.goal={x:28+Math.random()*44,y:Math.min(c.yMax,Math.max(c.yMin,32+Math.random()*24)),until:Date.now()+5000,happy:true};});
  const a=fishAnim.find(x=>x.uid===f.uid);if(a)a.clickAnim=20;
  say(f,fill(pick(GREET[key]),{n:f.name}),8000);
  sfx('pet');
}
function noteAvailable(){return S.waterAdded&&S.fish.length&&S.tutDone&&S.noteDate!==todayStr();}
// called once per opening (page load, or coming back after a while)
function openingFlow(away){
  away=away||{ms:0};
  const long=away.ms>=30*60000;
  _quietUntil=Math.max(_quietUntil,Date.now()+5000);
  const go=()=>{
    greet(away.ms);
    if(noteAvailable())setTimeout(spawnLetter,2600);
    surpriseAfterGreet(away);
  };
  if(long){openDiary(away,true);return;}// greet after the diary is closed
  setTimeout(go,1100);
}

const SCHEME=0;// v3.0: all three parts are on (kept for older code that reads it)
const SCH={1:{},2:{},3:{}};// each part fills in its hooks
const EVENTS={1:[],2:[],3:[]};// …and its surprise events
function allEvents(){return EVENTS[2].concat(EVENTS[1],EVENTS[3]);}// calendar days first
// run a hook in every part; the first answer wins (most hooks just draw or update)
function X(name,...a){let out;for(const k of XORDER[name]||[2,1,3]){const h=SCH[k][name];if(h){const r=h(...a);if(out===undefined&&r!==undefined)out=r;}}return out;}
const XORDER={drawFront:[1,3,2],goal:[1,3],tap:[3,1,2]};

/* ── little helpers ── */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// draw a tiny pixel pattern: rows of characters, each mapped to a colour ('.' or unmapped = clear)
function pix(ctx,rows,x,y,s,map,flip){
  const w=rows[0].length;
  for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const c=map[r[i]];if(c){ctx.fillStyle=c;ctx.fillRect(x+(flip?w-1-i:i)*s,y+j*s,s,s);}}}
}
const _iconCache={};
function pixURL(key,rows,map,s){if(_iconCache[key])return _iconCache[key];const c=document.createElement('canvas');c.width=rows[0].length*(s||3);c.height=rows.length*(s||3);pix(c.getContext('2d'),rows,0,0,s||3,map);return(_iconCache[key]=c.toDataURL());}
function tankGeo(){const c=document.getElementById('TC');const W=c.width,H=c.height;const flY=Math.round(H*0.75/2)*2;return{W,H,flY,sandH:H-flY};}
function baseYOf(g,d){return g.flY+Math.round((d||0.5)*g.sandH*0.55);}
function weightedPick(list){const tot=list.reduce((a,e)=>a+(e.w||1),0);let r=Math.random()*tot;for(const e of list){r-=(e.w||1);if(r<=0)return e;}return list[list.length-1];}
function spriteTop(img,fx){// first opaque row in a column (fx 0..1), cached per sprite canvas
  if(!img||!img.getContext)return Math.round(img?img.height*0.2:0);
  const m=img._tops||(img._tops={});const k=Math.round(fx*10);if(m[k]!=null)return m[k];
  let top=Math.round(img.height*0.2);
  try{const x=Math.min(img.width-1,Math.max(0,Math.round(img.width*fx)));const d=img.getContext('2d').getImageData(x,0,1,img.height).data;for(let y=0;y<img.height;y++)if(d[y*4+3]>40){top=y;break;}}catch(e){}
  return(m[k]=top);
}
function decoTops(img){// the top outline of a decoration sprite, one value per pixel column
  if(img._decoTops)return img._decoTops;
  const tops=new Array(img.width).fill(-1);
  try{const d=img.getContext('2d').getImageData(0,0,img.width,img.height).data;for(let x=0;x<img.width;x++)for(let y=0;y<img.height;y++)if(d[(y*img.width+x)*4+3]>60){tops[x]=y;break;}}catch(e){}
  return(img._decoTops=tops);
}

function snapTank(cap,icon){

let _ev=null;// the surprise happening right now
function evStart(def,o){
  if(!def)return;
  if((def.force&&!def.force())||(def.when&&!def.when()))return;// things may have changed since it was picked
  _ev=Object.assign({def,id:def.id,t0:Date.now()},o||{});
  if(def.start)def.start(_ev);
  if(!def.quiet)S.surpDay=todayStr();S.surpLog=S.surpLog||{};S.surpLog[def.id]=(S.surpLog[def.id]||0)+1;sv();
}
function evEnd(){_ev=null;}
function forceSurprise(id){const d=allEvents().find(e=>e.id===id);if(d){_ev=null;evStart(d);}return!!d;}// for testing
function surpriseChance(kind,away){
  if(_ev||!S.tutDone||!S.waterAdded||!S.fish.length)return 0;
  const today=todayStr();
  if(kind==='open')return S.surpDay!==today?0.7:(away&&away.ms>=2*HOUR?0.3:0.05);
  if(S.idleDay!==today){S.idleDay=today;S.idleN=0;}
  return(S.idleN||0)<2?0.15:0;
}
function rollSurprise(kind,away){
  const pool=allEvents().filter(e=>!e.when||e.when());
  if(!pool.length||(_ev)||!S.tutDone||!S.waterAdded||!S.fish.length)return null;
  const forced=pool.filter(e=>e.force&&e.force());
  if(forced.length)return forced[0];
  const p=surpriseChance(kind,away);if(Math.random()>=p)return null;
  const rnd=pool.filter(e=>!e.force);if(!rnd.length)return null;
  if(kind==='idle')S.idleN=(S.idleN||0)+1;
  return weightedPick(rnd);
}

function arrItems(){
  const g=tankGeo();const out=[];
  (S.decos||[]).forEach(d=>{const img=decoImg(d.id,ART_SC);const cx=d.x*g.W,by=baseYOf(g,d.d);out.push({kind:'deco',ref:d,x0:cx-img.width/2,x1:cx+img.width/2,y0:by-img.height+ART_SC*2,y1:by+6,depth:d.d||0.5});});
  (S.plantSeeds||[]).forEach(p=>{const by=baseYOf(g,p.d);const form=PLANT_FORM[p.id]||{};const h=getPlantH(p)*3*(0.7+(p.d||0.5)*0.6)*(form.hMul||1);const hw=form.type==='ball'?22:Math.max(14,Math.min(40,h*0.35));const cx=p.x*g.W;out.push({kind:'plant',ref:p,x0:cx-hw,x1:cx+hw,y0:by-Math.max(20,h),y1:by+6,depth:p.d||0.5});});

function arrPoint(e){const c=document.getElementById('TC');const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};}
function wireArrange(){
  const c=document.getElementById('TC');
  c.addEventListener('pointerdown',e=>{
    if(!arranging())return;
    const p=arrPoint(e);const hit=arrItems().find(it=>p.x>=it.x0&&p.x<=it.x1&&p.y>=it.y0&&p.y<=it.y1);
    _arr.sel=hit?{kind:hit.kind,ref:hit.ref}:null;
    if(!hit)return;
    _arr.drag={sx:p.x,sy:p.y,ox:hit.ref.x,od:hit.ref.d||0.5,moved:false};
    try{c.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  c.addEventListener('pointermove',e=>{
    if(!_arr||!_arr.drag||!_arr.sel)return;
    const p=arrPoint(e);const g=tankGeo();const dr=_arr.drag;
    const dx=p.x-dr.sx,dy=p.y-dr.sy;if(Math.abs(dx)+Math.abs(dy)>5)dr.moved=true;
    const r=_arr.sel.ref;
    r.x=Math.min(0.96,Math.max(0.04,dr.ox+dx/g.W));
    r.d=Math.min(0.88,Math.max(0.12,dr.od+dy/(g.sandH*0.55)));
    e.preventDefault();
  });
  const up=e=>{
    if(!_arr||!_arr.drag)return;
    if(!_arr.drag.moved&&_arr.sel&&_arr.sel.kind==='deco'){_arr.sel.ref.flip=!_arr.sel.ref.flip;sfx('tap');}
    else if(_arr.drag.moved)sfx('tap');
    _arr.drag=null;sv();
  };
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
}
function drawArrangeSel(ctx,W,H,t){
  if(!_arr)return;

  items.forEach(it=>{
    const sel=_arr.sel&&_arr.sel.ref===it.ref;
    if(!sel&&Math.sin(t*3)<0)return;
    const x0=Math.round(it.x0/2)*2,y0=Math.round(it.y0/2)*2,x1=Math.round(it.x1/2)*2,y1=Math.round(it.y1/2)*2;
    ctx.fillStyle=sel?PALC('#ff7fae'):'rgba(255,255,255,0.8)';

}

/* ═══ ② SEASONS & LITTLE DAYS ═══
   The tank follows the real calendar. Every day has its own weather;
   autumn leaves float on the surface, petals in spring, snow in winter.
   The moon shows its phase at night. Holidays dress the tank up,
   fish have birthdays (1 day, 1 week, 1 month, 100 days…), and every
   day you visit gets a sticker in a calendar — gaps are fine, no streaks. */
function calNow(){return window.__fakeDay?new Date(window.__fakeDay+'T'+String(new Date().getHours()).padStart(2,'0')+':'+String(new Date().getMinutes()).padStart(2,'0')+':00'):new Date();}
function calToday(){return dateStr(calNow());}
function seasonOf(d){const m=d.getMonth()+1;return m===12||m<=2?'winter':m<=5?'spring':m<=8?'summer':'autumn';}
const SEASON_INFO={winter:{ico:'❄',name:'Winter'},spring:{ico:'🌸',name:'Spring'},summer:{ico:'☀',name:'Summer'},autumn:{ico:'🍂',name:'Autumn'}};
const WX={sunny:{ico:'☀',name:'Sunny',line:'A bright, sunny day in the tank.'},cloudy:{ico:'☁',name:'Cloudy',line:'Soft, cloudy light today. Good for napping.'},rainy:{ico:'🌧',name:'Rainy',line:'Rain is tapping on the water. Listen…'},snowy:{ico:'🌨',name:'Snowy',line:'Snow is falling into the tank. So quiet.'},windy:{ico:'🍃',name:'Breezy',line:'A breezy day — the surface is all ripples.'}};
function weatherOf(ds){
  const r=(hashStr('wx'+ds)%100)/100;const s=seasonOf(new Date(ds+'T12:00:00'));
  if(r<0.42)return'sunny';if(r<0.62)return'cloudy';if(r<0.85)return s==='winter'&&r>0.72?'snowy':'rainy';return s==='winter'?'snowy':'windy';
}
function moonPhase(d){const P=29.530588853;const days=(d.getTime()-Date.UTC(2000,0,6,18,14))/86400000;return((days%P)+P)%P/P;}
function moonName(p){return p<0.034||p>0.966?'New moon':p<0.25?'Waxing crescent':p<0.284?'First quarter':p<0.466?'Waxing gibbous':p<0.534?'Full moon':p<0.716?'Waning gibbous':p<0.75?'Last quarter':'Waning crescent';}
function isFullMoon(d){const p=moonPhase(d);return Math.abs(p-0.5)<0.034;}
const LUNAR_NY=['2026-02-17','2027-02-06','2028-01-26','2029-02-13','2030-02-03'];
const MID_AUTUMN=['2026-09-25','2027-09-15','2028-10-03','2029-09-22','2030-09-12'];
const HOLI={
  newyear:{ico:'🎆',name:'Happy New Year!',text:'A whole new year of slow, cosy days together.'},
  lunar:{ico:'🧧',name:'Happy Lunar New Year!',text:'Red lanterns are glowing in the tank. Wishing you luck and good health.'},
  valentine:{ico:'💗',name:'Happy Valentine\'s Day',text:'The fish blew heart-shaped bubbles. For you, obviously.'},
  spring:{ico:'🌱',name:'First day of spring',text:'Petals are drifting in. Everything is starting again, gently.'},

  halloween:{ico:'🎃',name:'Happy Halloween!',text:'Little pumpkins are glowing on the decorations. Spooky… but cute.'},
  solstice:{ico:'🌌',name:'The longest night',text:'From tomorrow, the days get longer again. Rest well tonight.'},
  christmas:{ico:'🎄',name:'Merry Christmas!',text:'Twinkly lights and tiny hats. Warm wishes from the whole tank.'},
  nye:{ico:'✨',name:'Last day of the year',text:'You made it through a whole year. That\'s worth celebrating.'},
};
function holidayOf(ds){
  const md=ds.slice(5);
  if(md==='01-01')return'newyear';if(LUNAR_NY.includes(ds))return'lunar';if(md==='02-14')return'valentine';if(md==='03-20')return'spring';
  if(MID_AUTUMN.includes(ds))return'midautumn';if(md>='10-30'&&md<='10-31')return'halloween';if(md==='12-21')return'solstice';
  if(md==='12-24'||md==='12-25')return'christmas';if(md==='12-31')return'nye';return null;
}

const LEAF=['..o.','.oo.','oooo','.oy.'],PETAL=['.p.','ppp','.p.'],FLAKE=['.w.','www','.w.'],HEART=['p.p','ppp','.p.'];

let _parts=[],_wxShow=null,_confetti=[];
function seasonParts(W,H,t,season,wx,burst){
  const want=burst?60:season==='autumn'?12:season==='spring'?18:season==='winter'||wx==='snowy'?(wx==='snowy'?40:14):6;
  while(_parts.length<want){
    const kind=wx==='snowy'||season==='winter'?'snow':season==='autumn'?'leaf':season==='spring'?'petal':'spark';
    _parts.push({kind,x:Math.random()*W,y:kind==='snow'?Math.random()*H*0.7:Math.random()*8,vy:kind==='snow'?6+Math.random()*8:0,float:kind!=='snow'&&Math.random()<0.7,ph:Math.random()*6,c:kind==='leaf'?pick(['#e8803a','#d9542b','#f2b33d','#c76b2a']):kind==='petal'?pick(['#ff8fb8','#ffa8c8','#ff7fae']):'#ffffff'});
  }
  if(_parts.length>want+4)_parts.length=want;
}
function drawParts(ctx,W,H,t,dt,flY,wx){
  const wind=wx==='windy'?14:wx==='rainy'?4:3;
  _parts.forEach(p=>{
    if(p.kind==='snow'){p.y+=p.vy*dt;p.x+=Math.sin(t+p.ph)*0.3;if(p.y>flY){p.y=-4;p.x=Math.random()*W;}pix(ctx,FLAKE,Math.round(p.x/2)*2,Math.round(p.y/2)*2,2,{w:'rgba(255,255,255,0.9)'});return;}
    if(p.kind==='spark'){const a=0.5+0.5*Math.sin(t*3+p.ph);if(a>0.7){ctx.fillStyle='#fffbe0';ctx.fillRect(Math.round(p.x/2)*2,4+Math.round(p.ph)*2,2,2);}return;}
    p.x+=(wind*(p.float?1:0.5)+Math.sin(t*0.6+p.ph)*4)*dt;if(p.x>W+8)p.x=-8;
    if(!p.float){p.y+=(5+Math.sin(t+p.ph)*3)*dt;if(p.y>flY+10){p.y=2;p.float=Math.random()<0.6;}}
    else p.y=3+Math.sin(t*1.4+p.ph)*2;
    pix(ctx,p.kind==='leaf'?LEAF:PETAL,Math.round(p.x/2)*2,Math.round(p.y/2)*2,2,p.kind==='leaf'?{o:p.c,y:'#ffe08a'}:{p:p.c},Math.sin(t+p.ph)>0);
  });
}
