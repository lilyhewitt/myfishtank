<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Aquarium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated;}
/* v2.5 — light "Tamagotchi colour" theme: cream page, white toy-like cards, candy accents */
:root{
  --bg:#fff4ea;--card:#ffffff;--line:#f2dccb;--line2:#ead6f4;
  --text:#4b3a5e;--muted:#9a88ab;
  --mint:#38c99a;--mint-d:#22a37a;--pink:#ff7fae;--pink-d:#e45f93;
  --gold:#f2a223;--gold-t:#c27a00;--blue:#4aa6ee;--blue-d:#2f86cf;--red:#f2557a;--purple:#a387ee;
  --green:var(--mint);--panel:var(--card);--border:var(--line);
  --font:'VT323',monospace;--pfont:'Press Start 2P',monospace;
}
/* The game paints its own light background so it looks the same inside any host */
html{background:#fff4ea !important;color-scheme:light;}
body{background:#fff4ea !important;background-image:radial-gradient(#ffe2ec 1.2px,transparent 1.3px) !important;background-size:18px 18px !important;color:var(--text);font-family:var(--font);font-size:16px;min-height:100vh;-webkit-tap-highlight-color:transparent;}
#app{max-width:900px;margin:0 auto;padding:.5rem;min-height:100vh;color:var(--text);}
.game-title{font-family:var(--pfont);font-size:11px;color:var(--pink);text-align:center;padding:8px 0 4px;letter-spacing:2px;text-shadow:2px 2px 0 #ffd9e7;}
.game-title::after{content:'';display:block;width:60%;height:2px;background:repeating-linear-gradient(90deg,#ffb3cf 0 6px,transparent 6px 10px);margin:7px auto 0;}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:4px;flex-wrap:wrap;}
.top-bar-left{display:flex;align-items:center;gap:4px;white-space:nowrap;}
.top-bar-right{display:flex;align-items:center;gap:4px;}
.tank-outer{border:4px solid #ff9ec4;border-radius:16px;overflow:hidden;margin-bottom:8px;position:relative;box-shadow:0 4px 0 #ef7fab,0 10px 22px rgba(255,140,180,.22);background:#cdf1f1;}
#TC{display:block;width:100%;image-rendering:pixelated;cursor:pointer;}
.hud{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap;}
.hud-stat{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:3px 8px;font-size:14px;flex:1;min-width:70px;text-align:center;color:var(--muted);cursor:default;box-shadow:0 2px 0 var(--line);}
.hud-stat b{display:block;font-size:17px;color:var(--text);}
.hud-stat.warn b{color:#e08a00;}.hud-stat.bad b{color:var(--red);}.hud-stat.good b{color:var(--mint-d);}
.hud-stat.clickable{cursor:pointer;transition:background .2s;}.hud-stat.clickable:hover{background:#fff8f2;}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px;position:sticky;top:0;z-index:20;background:#fff4ea;padding:4px 0;}
.tab{padding:5px 2px 4px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);cursor:pointer;font-size:12px;font-family:var(--font);transition:all .2s;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1;min-width:0;box-shadow:0 2px 0 var(--line);}
.tab .ti{font-size:16px;line-height:18px;}.tab .tl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.tab:hover{background:#fff8f2;}.tab.on{background:var(--pink);color:#fff;border-color:var(--pink-d);box-shadow:0 2px 0 var(--pink-d);}
.tab .notif{position:absolute;top:-4px;right:-4px;width:8px;height:8px;background:var(--red);border-radius:50%;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.sc{display:none;}.sc.v{display:block;animation:fadeIn .2s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 2px 0 var(--line);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;}
.item{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px;text-align:center;transition:all .2s;box-shadow:0 2px 0 var(--line);}
.item:hover{border-color:#ffb3cf;}
.item canvas{display:block;margin:0 auto 4px;image-rendering:pixelated;}
.iname{font-size:14px;color:var(--text);margin-bottom:2px;}.idesc{font-size:11px;color:var(--muted);margin-bottom:4px;}
.iprice{font-size:13px;color:var(--gold-t);margin-bottom:5px;}
.item button{padding:5px 8px;font-size:13px;border:none;border-radius:8px;background:var(--mint);color:#fff;cursor:pointer;font-family:var(--font);width:100%;transition:all .2s;box-shadow:0 2px 0 var(--mint-d);}
.item button:hover{background:#2fbd8e;}
.item button:disabled{background:#eee6ef;color:#b6a8c2;box-shadow:0 2px 0 #ddd2e2;cursor:not-allowed;}
.owned{font-size:11px;color:var(--mint-d);background:#e2f8ef;padding:1px 7px;border-radius:20px;display:inline-block;margin-top:3px;}
.rare-tag{font-size:10px;color:#8a5ce8;background:#f0e8ff;padding:1px 6px;border-radius:8px;display:inline-block;margin-bottom:2px;animation:shimmer 2s infinite;}
.super-rare-tag{font-size:10px;color:#c47400;background:#fff0c7;padding:1px 6px;border-radius:8px;display:inline-block;margin-bottom:2px;animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%,100%{opacity:1;}50%{opacity:0.55;}}
.bar{height:7px;background:#f3e8ef;border-radius:20px;overflow:hidden;margin-top:3px;}
.fill{height:100%;border-radius:20px;transition:width .4s;}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.lbl{font-size:13px;color:var(--muted);width:95px;flex-shrink:0;}.val{font-size:12px;font-weight:500;width:28px;text-align:right;}
.btn{padding:8px 16px;background:var(--mint);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:15px;font-family:var(--font);transition:all .2s;box-shadow:0 3px 0 var(--mint-d);}
.btn:hover{filter:brightness(1.05);}.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
.al{padding:7px 11px;border-radius:9px;font-size:14px;margin-bottom:7px;animation:slideIn .3s ease-out;}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.ok{background:#e4f8f0;color:#1d8f69;border:2px solid #bfeedb;}
.warn{background:#fff3dc;color:#b97200;border:2px solid #ffdf9e;}
.bad{background:#ffe8ee;color:#d23d63;border:2px solid #ffc5d3;}
.stitle{font-family:var(--pfont);font-size:9px;letter-spacing:1px;color:var(--text);margin-bottom:8px;}
.fcard{display:flex;align-items:center;gap:9px;padding:8px;margin-bottom:6px;background:var(--card);border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:all .2s;box-shadow:0 2px 0 var(--line);}
.fcard:hover{border-color:#ffb3cf;}
.finfo{flex:1;}.fname{font-size:15px;color:var(--text);}
.ftag{font-size:11px;padding:0 6px;border-radius:10px;display:inline-block;margin-right:3px;margin-top:2px;}
.ftag-baby{background:#e3f2ff;color:#2f86cf;}.ftag-adult{background:#e2f8ef;color:#1d8f69;}
.ftag-sick{background:#ffe8ee;color:#d23d63;}.ftag-age{background:#fff0c7;color:#b97200;}.ftag-mood{background:#f2eaff;color:#8a5ce8;}
.fbtns{display:flex;flex-direction:column;gap:3px;}
.fbtns button{font-size:12px;padding:3px 8px;border:2px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-family:var(--font);color:var(--text);}
.fbtns button:hover{background:var(--mint);border-color:var(--mint);color:#fff;}
.coins-display{font-family:var(--pfont);font-size:9px;color:var(--gold-t);background:#fff1cc;border:2px solid #ffd98a;padding:4px 7px;border-radius:9px;white-space:nowrap;}
.level-display{font-family:var(--pfont);font-size:9px;color:#8a5ce8;background:#f1eaff;border:2px solid #dccbff;padding:4px 7px;border-radius:9px;white-space:nowrap;}
.tank-size-badge{font-size:11px;color:var(--blue-d);background:#e4f2ff;border:2px solid #c3e1fb;padding:0 6px;border-radius:10px;white-space:nowrap;}
.audio-btn{font-family:var(--pfont);font-size:8px;padding:4px 7px;border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);cursor:pointer;}
.audio-btn.on{color:var(--mint-d);border-color:#bfeedb;}
.ach-card{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:5px;background:var(--card);border:2px solid var(--line);border-radius:12px;}
.ach-card.done{border-color:#bfeedb;background:#f3fcf8;}
.ach-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
.ach-info{flex:1;}.ach-name{font-size:14px;color:var(--text);}.ach-desc{font-size:12px;color:var(--muted);margin-top:1px;}
.ach-reward{font-size:12px;color:var(--gold-t);margin-top:2px;}.ach-check{color:var(--mint-d);font-size:16px;}
.ach-popup{pointer-events:none;position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-90px);background:#fff;border:3px solid var(--pink);border-radius:14px;padding:10px 18px;z-index:9999;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 var(--pink-d),0 10px 26px rgba(255,127,174,.3);transition:transform .5s cubic-bezier(.34,1.56,.64,1);font-family:var(--font);}
.ach-popup.show{transform:translateX(-50%) translateY(0);}
.ach-popup .ach-text{color:var(--pink-d);font-size:15px;}.ach-popup .ach-sub{color:var(--muted);font-size:13px;}
.stat-box{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.stat-item{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
.stat-val{font-size:12px;color:var(--gold-t);font-family:var(--pfont);}.stat-label{font-size:13px;color:var(--muted);margin-top:4px;}
.upgrade-card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.upgrade-card .up-icon{font-size:22px;width:36px;text-align:center;}.upgrade-card .up-info{flex:1;}
.upgrade-card .up-name{font-size:15px;color:var(--text);}.upgrade-card .up-desc{font-size:12px;color:var(--muted);margin-top:2px;}
.upgrade-card .up-price{font-size:13px;color:var(--gold-t);margin-top:3px;}
.feed-particle{position:absolute;pointer-events:none;font-size:10px;animation:feedDrop 1.2s ease-in forwards;}
@keyframes feedDrop{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(60px);}}
.coin-fly{position:fixed;pointer-events:none;font-family:var(--pfont);font-size:10px;color:#e08a00;text-shadow:1px 1px 0 #fff;z-index:9999;animation:coinUp 1s ease-out forwards;}
@keyframes coinUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-40px);}}
.tank-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:10;}
.setup-panel{background:#ffffff;border:3px solid #ffb3cf;border-radius:14px;padding:12px 16px;width:min(320px,88%);pointer-events:all;box-shadow:0 3px 0 #f7a0c2;}
.setup-panel .sp-title{font-family:var(--pfont);font-size:9px;color:var(--pink-d);margin-bottom:10px;text-align:center;letter-spacing:1px;}
.setup-step{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:2px dotted #f3e2d6;font-size:15px;}
.setup-step:last-of-type{border-bottom:none;}
.setup-step .ss-label{color:var(--muted);}.setup-step.done .ss-label{color:var(--mint-d);}
.water-btn{width:100%;margin-top:10px;padding:8px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-family:var(--font);font-size:16px;box-shadow:0 3px 0 var(--blue-d);}
.water-btn:hover{filter:brightness(1.05);}.water-btn:disabled{opacity:.45;cursor:not-allowed;}
.refresh-note{font-size:12px;color:var(--muted);margin-bottom:8px;text-align:center;}
/* toasts, welcome-back card, setup buy buttons */
#toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;flex-direction:column;gap:5px;width:min(92vw,420px);pointer-events:none;}
.toast{font-family:var(--font);font-size:15px;padding:5px 11px;border-radius:11px;background:#fff;border:2px solid var(--line);color:var(--text);box-shadow:0 3px 0 var(--line),0 6px 16px rgba(120,90,140,.15);animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);text-align:center;}
.toast.ok{border-color:#9fe6c9;color:#1d8f69;}.toast.warn{border-color:#ffd27a;color:#b97200;}.toast.bad{border-color:#ffb0c3;color:#d23d63;}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s;}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.96);}to{opacity:1;transform:none;}}
.modal-bg{position:fixed;inset:0;background:rgba(90,60,100,.35);z-index:9997;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .25s;}
.modal{background:#fff;border:3px solid var(--pink);border-radius:16px;padding:16px 18px;width:min(360px,100%);box-shadow:0 4px 0 var(--pink-d),0 14px 34px rgba(120,60,110,.25);font-family:var(--font);color:var(--text);}
.modal h3{font-family:var(--pfont);font-size:10px;color:var(--pink-d);text-align:center;margin-bottom:12px;letter-spacing:1px;line-height:1.6;}
.modal .mrow{display:flex;justify-content:space-between;font-size:16px;padding:4px 0;border-bottom:2px dotted #f3e2d6;color:var(--text);}
.modal .mrow span:last-child{color:var(--gold-t);}
.modal .mnote{font-size:14px;color:var(--muted);margin-top:8px;text-align:center;}
.modal .btn{width:100%;margin-top:12px;}
.ss-buy{font-family:var(--font);font-size:14px;padding:2px 9px;border-radius:7px;border:none;background:var(--mint);color:#fff;cursor:pointer;box-shadow:0 2px 0 var(--mint-d);}
.ss-buy:disabled{opacity:.45;}
.hud-stat b{transition:color .3s;}
.bd-chip{cursor:pointer;}.bd-chip.on{border-color:var(--pink)!important;color:var(--pink-d);}
/* every shop card shares one structure:
   [preview box 80px][tag slot 16px][name][desc][extra][price] … [button pinned to bottom] */
.item{display:flex;flex-direction:column;align-items:stretch;padding:8px;min-width:0;}
.item .pv{height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;background:linear-gradient(#e9fbfb,#d4f2f3);border-radius:9px;}
.item .pv canvas{display:block;margin:0;}
.item .pv .ico{font-size:32px;line-height:80px;height:80px;}
.item .tags{height:16px;display:flex;gap:4px;justify-content:center;align-items:center;margin-bottom:3px;overflow:hidden;}
.item .tags>*{margin:0 !important;white-space:nowrap;line-height:14px;}
.item .iname,.item .idesc,.item .itemp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .itemp{font-size:11px;color:var(--muted);margin-bottom:3px;}
.item .ibtn{margin-top:auto;padding-top:2px;}
.item .ibtn .full{font-size:12px;color:var(--red);height:26px;line-height:26px;}
.upgrade-tag{font-size:10px;color:#b97200;background:#fff0c7;padding:1px 6px;border-radius:8px;display:inline-block;}
.fcard .fthumb{width:60px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e9fbfb,#d4f2f3);border-radius:8px;}
.fcard .finfo{min-width:0;}
.fcard .fbtns{width:106px;flex-shrink:0;}
.fcard .fbtns button{width:100%;white-space:nowrap;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;}
.mine-row .mthumb{width:66px;height:40px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#e9fbfb,#d4f2f3);border-radius:8px;}
.mine-row button{min-width:62px;white-space:nowrap;}
/* tutorial, move mode, quests sub-tabs, book, tasks */
#tut{display:none;align-items:center;gap:8px;background:#fff;border:2px solid #ffc7dc;border-radius:12px;padding:6px 10px;margin-bottom:6px;font-size:15px;color:var(--text);box-shadow:0 2px 0 #ffc7dc;}
#tut.show{display:flex;animation:fadeIn .3s;}
#tut .tstep{font-family:var(--pfont);font-size:8px;color:var(--pink-d);white-space:nowrap;}
#tut .ttext{flex:1;line-height:1.15;}
#tut button{font-family:var(--font);font-size:13px;background:#fff;border:2px solid var(--line);color:var(--muted);border-radius:7px;padding:1px 7px;cursor:pointer;}
.hl{animation:hlPulse 1.1s ease-in-out infinite !important;position:relative;z-index:3;}
@keyframes hlPulse{0%,100%{box-shadow:0 0 0 0 #ff7fae00;}50%{box-shadow:0 0 0 4px #ff7faeaa;}}
.place-banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#ffffffee;border:2px solid var(--pink);color:var(--pink-d);border-radius:10px;padding:4px 10px;font-size:15px;z-index:12;display:flex;gap:8px;align-items:center;white-space:nowrap;pointer-events:all;}
.place-banner button{font-family:var(--font);font-size:13px;background:#fff;color:var(--text);border:2px solid var(--line);border-radius:7px;padding:1px 8px;cursor:pointer;}
.mine-row{display:flex;align-items:center;gap:8px;padding:5px 8px;margin-bottom:4px;background:var(--card);border:2px solid var(--line);border-radius:12px;}
.mine-row canvas{flex-shrink:0;}
.mine-row .mn{flex:1;font-size:15px;}
.mine-row button{font-family:var(--font);font-size:13px;padding:2px 8px;border-radius:7px;border:2px solid var(--line);background:#fff;color:var(--text);cursor:pointer;}
.mine-row button.rm{color:#d23d63;}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;}
.seg button{font-family:var(--font);font-size:15px;padding:5px 4px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;position:relative;box-shadow:0 2px 0 var(--line);}
.seg button.on{background:var(--mint);border-color:var(--mint-d);color:#fff;box-shadow:0 2px 0 var(--mint-d);}
.seg .notif,.tab .notif{position:absolute;top:-4px;right:-4px;width:9px;height:9px;background:var(--red);border-radius:50%;animation:pulse 1.5s infinite;}
.task{display:flex;align-items:center;gap:9px;padding:8px 10px;margin-bottom:5px;background:var(--card);border:2px solid var(--line);border-radius:12px;}
.task.done{border-color:#bfeedb;}.task.claimed{opacity:.6;}
.task .tk{flex:1;}.task .tt{font-size:15px;}.task .tr{font-size:13px;color:var(--gold-t);}
.task .bar{margin-top:4px;}
.task button{font-family:var(--font);font-size:14px;padding:4px 10px;border-radius:8px;border:none;background:var(--mint);color:#fff;cursor:pointer;box-shadow:0 2px 0 var(--mint-d);}
.streak{font-size:15px;color:#e0782c;text-align:center;margin:6px 0 4px;}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:5px;margin-bottom:10px;}
.bk{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:5px 2px 4px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:0;overflow:hidden;}
.bk.sel{border-color:var(--pink);}
.bk canvas{image-rendering:pixelated;}
.bk .bn{font-size:12px;color:var(--text);margin-top:3px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.bk.unseen .bn{color:var(--muted);}
.book-detail{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;min-height:70px;}
.book-detail .bd-t{font-size:17px;color:var(--pink-d);}.book-detail .bd-f{font-size:15px;color:var(--text);margin-top:2px;line-height:1.2;}
.bsec{font-family:var(--pfont);font-size:8px;color:var(--muted);margin:8px 0 5px;letter-spacing:1px;}
.save-ta{width:100%;height:110px;background:#fffaf5;color:var(--text);border:2px solid var(--line);border-radius:10px;font-family:monospace;font-size:11px;padding:6px;resize:none;margin-top:6px;}
.btn2{font-family:var(--font);font-size:14px;padding:5px 10px;border-radius:9px;border:2px solid var(--line);background:#fff;color:var(--text);cursor:pointer;box-shadow:0 2px 0 var(--line);}
/* v2.6 — fish close-up sheet (the tank stays visible above it) */
.pet-sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,112%);width:min(460px,100%);z-index:9990;transition:transform .32s cubic-bezier(.3,1.25,.5,1);padding:0 6px 6px;pointer-events:none;}
.pet-sheet.show{transform:translate(-50%,0);}

function _role(h,s,l){
  if(s<0.10)return'gray';

  if((h>=344||h<12)&&s>0.55&&l<0.68)return'alert';

  vib(ac,t,f,v,echo,len){len=len||2.4;voice(ac,t,f,len,{vol:v,a:0.006,trem:[4.6,0.35],echo});voice(ac,t,f*4,len*0.25,{vol:v*0.1,a:0.003});},

  cel(ac,t,f,v,echo,len){len=len||1.2;voice(ac,t,f,len,{vol:v,a:0.003,echo});voice(ac,t,f*3,len*0.3,{vol:v*0.14,a:0.002,echo});},

  bub(ac,t,f,v,echo,len){len=len||0.5;voice(ac,t,f,len,{vol:v,a:0.005,from:0.72,echo,lp:3500});},
  // soft airy pad (no low end): detuned triangles, slow attack, low-passed
  pad(ac,t,f,v,len){voice(ac,t,f,len,{type:'triangle',vol:v,a:Math.min(1.2,len*0.3),hold:len*0.6,lp:1800});voice(ac,t,f*1.005,len,{type:'triangle',vol:v*0.6,a:Math.min(1.4,len*0.35),hold:len*0.55,lp:1600});},

  pop(ac,t,f0,f1,v){voice(ac,t,f0,0.12,{vol:v,a:0.004,glide:[f1,0.1]});},
};
// play a score: [[midi, beat, lenBeats, vol?], ...] with a timbre

/* ══════════ five music themes, one for each colour scheme ══════════
   Four are arrangements of public-domain classical pieces, played on the
   game's own synth instruments (kalimba, celesta, music box, vibraphone);
   'Candy' keeps the original music-box waltz.                              */
const OLD=SETS0;
// the chord tones of Bach's Prelude in C (BWV 846), bars 1–19: [bass, 2nd, then the three notes that ripple]
const BACH=[[60,64,67,72,76],[60,62,69,74,77],[59,62,67,74,77],[60,64,67,72,76],[60,64,69,76,81],[60,62,66,69,74],[59,62,67,74,79],[59,60,64,67,72],
  [57,60,64,67,72],[50,57,62,66,72],[55,59,62,67,71],[55,58,64,67,73],[53,57,62,69,74],[53,56,62,65,71],[52,55,60,67,72],[52,53,57,60,65],[50,53,57,60,65],[43,50,55,59,65],[48,52,55,60,64]];
function bachBar(ac,t,B,n,o){
  // each half bar: bass, second note, then the upper three twice — n1 n2 n3 n4 n5 n3 n4 n5
  [0,8].forEach(h=>{
    if(o.night&&h)return;
    T.cel(ac,t+h*B,mtof(n[0]+12),o.bv,0.2,8*B*1.3);
    T.cel(ac,t+(h+1)*B,mtof(n[1]+12),o.bv*0.8,0.2,7*B*1.2);
    const up=o.night?[2,3,4]:[2,3,4,2,3,4];
    up.forEach((k,j)=>T[o.tim](ac,t+(h+2+j*(o.night?2:1))*B+rnd(0,0.008),mtof(n[k]+12),(j===0?1.2:1)*o.v,o.echo,o.len));
  });
}
// Satie, Gymnopédie No.1: left hand alternates Gmaj7 and Dmaj7; the melody of the opening phrase
const GYM_LH=[[55,[59,62,66]],[50,[57,61,66]]];
const GYM_MEL=[[78,13,1],[81,14,1],[79,15,1],[78,16,1],[73,17,1],[71,18,1],[73,19,1],[74,20,1],[69,21,3],[66,24,12]];
function gymPlay(ac,t,B,o){
  const bars=24;
  for(let i=0;i<bars;i++){
    const [b,ch]=GYM_LH[i%2];const bt=t+i*3*B;
    T.cel(ac,bt,mtof(b),o.lv*1.2,0.15,3*B*1.1);
    ch.forEach((m,k)=>T.vib(ac,bt+B+k*0.012,mtof(m),o.lv*(k?0.8:1),0.2,2*B*1.25));
    if(i%2===0&&o.pad)ch.forEach(m=>T.pad(ac,bt,mtof(m+12),o.pad,6*B));
  }
  // the phrase, twice (bars 5–12, then again from bar 13)
  [0,36].forEach(off=>GYM_MEL.forEach(([m,b,l])=>T.vib(ac,t+(b+off)*B+rnd(0,0.01),mtof(m),o.mv*(l>2?0.85:1),0.32,Math.min(l*B*1.4,7))));

const _sfxLast={};
const SFX_GAP={tap:0.05,eat:0.14,bubble:0.25,pet:0.12,coin:0.06,call:5,night:4};
function sfx(name){
  if(!SND.sfx)return;const ac=getAudio();if(!ac||ac.state!=='running')return;
  const now=ac.currentTime;if(now-(_sfxLast[name]||-9)<(SFX_GAP[name]||0.08))return;_sfxLast[name]=now;
  _sndDest=null;const t=now+0.01;
  try{
    if(name==='bubble')T.drop(ac,t,0.035,0.2);
    else if(name==='water'){for(let i=0;i<6;i++)T.drop(ac,t+i*0.07+rnd(0,0.03),0.04,0.25);T.pop(ac,t+0.45,500,900,0.05);}
    else{const fx=SETS[curTheme()].fx[name];if(fx)fx(ac,t);}
  }catch(e){}
}

let _bgmGen=0,_bgmTimer=null,_bgmNight=null;
function stopBGM(){
  _bgmGen++;clearTimeout(_bgmTimer);_bgmNight=null;
  _sndQ=_sndQ.filter(x=>x[2]!==MUSIC);
  if(MUSIC&&AC){const old=MUSIC;try{old.gain.setTargetAtTime(0,AC.currentTime,0.3);}catch(e){}setTimeout(()=>{try{old.disconnect();}catch(e){}},2000);MUSIC=AC.createGain();MUSIC.gain.value=MUSIC_VOL;MUSIC.connect(MASTER);}
}
function isNightHour(){return isNightNow();}
function startBGM(){
  if(!SND.music)return;const ac=getAudio();if(!ac||ac.state!=='running')return;
  stopBGM();const gen=++_bgmGen;const bus=MUSIC;
  bus.gain.setValueAtTime(0.0001,ac.currentTime);bus.gain.exponentialRampToValueAtTime(MUSIC_VOL,ac.currentTime+2.5);// fade in
  const loop=t0=>{
    if(gen!==_bgmGen)return;
    const night=isNightNow();_bgmNight=night;
    const B=SETS[curTheme()].bgm[night?'night':'day'];
    _sndDest=bus;try{B.play(ac,t0,B.beat);}catch(e){}_sndDest=null;
    const end=t0+B.beats*B.beat;
    _bgmTimer=setTimeout(()=>loop(Math.max(end,ac.currentTime+0.05)),Math.max(100,(end-ac.currentTime-1.5)*1000));
  };
  loop(ac.currentTime+0.4);
}
// day ↔ night music swap as soon as the clock crosses bedtime / wake-up
function soundTick(){if(SND.music&&_bgmNight!==null&&_bgmNight!==isNightNow())startBGM();}

function openSound(){
  getAudio();
  const bg=openModal('<h3>⚙ SETTINGS</h3>'
    +'<div class="snd-row"><span>Music</span><button class="snd-tg" data-t="music"></button></div>'
    +'<div class="snd-row"><span>Sound effects</span><button class="snd-tg" data-t="sfx"></button></div>'
    +'<div class="snd-lbl">Theme — tap to try</div>'
    +'<div class="snd-packs" data-nopal>'+UIPAL.list.map(p=>'<button class="snd-pack pal-pick" data-pal="'+p.id+'"><span class="th-top"><b>'+p.name+'</b><small>♪ '+(THEME_MUSIC[p.id]||'')+'</small></span><span class="pal-sw">'+UIPAL.swatch(p).map(c=>'<i style="background:'+c+'"></i>').join('')+'</span></button>').join('')+'</div>'
    +'<button class="btn" id="snd-close">Done</button>');
  const refresh=()=>{bg.querySelectorAll('.snd-tg').forEach(b=>{const on=SND[b.dataset.t];b.textContent=on?'ON':'OFF';b.classList.toggle('on',on);});bg.querySelectorAll('.pal-pick').forEach(b=>b.classList.toggle('on',b.dataset.pal===UIPAL.current().id));};
  refresh();
  bg.addEventListener('click',e=>{
    const tg=e.target.closest('.snd-tg');
    if(tg){const k=tg.dataset.t;SND[k]=!SND[k];saveSnd();if(k==='music'){if(SND.music)startBGM();else stopBGM();}else if(SND.sfx)sfx('pet');refresh();return;}
    const cp=e.target.closest('.pal-pick');if(cp){applyUIPal(cp.dataset.pal);sfx('tap');refresh();return;}
    if(e.target.id==='snd-close')bg.remove();
  });
}
function toggleAudio(){openSound();}
// First tap anywhere unlocks audio (browsers keep it silent until then), then music starts once.
function unlockAudio(){
  document.removeEventListener('pointerdown',unlockAudio,true);
  const ac=getAudio();if(!ac)return;
  ac.resume().then(()=>{if(SND.music)startBGM();}).catch(()=>{});
}

const rect = (x0, y0, x1, y1) => (x, y) => x >= x0 && x < x1 && y >= y0 && y < y1;
const and = (...f) => (x, y) => f.every(g => g(x, y));
const or = (...f) => (x, y) => f.some(g => g(x, y));
const not = f => (x, y) => !f(x, y);
const rot = (pts, ox, oy, a) => pts.map(([x, y]) => [ox + (x - ox) * Math.cos(a) - (y - oy) * Math.sin(a), oy + (x - ox) * Math.sin(a) + (y - oy) * Math.cos(a)]);

function Spr(W, H) {
  const N = W * H, col = new Array(N).fill(null), hx = new Array(N).fill(null), part = new Int16Array(N).fill(-1);
  const S = {
    W, H, col, hx, part, res: null,
    paint(test, hex, tone = 1, p = 0) { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (test(x + 0.5, y + 0.5)) { const i = y * W + x; col[i] = KK(hex)[tone]; hx[i] = hex; part[i] = p; } return S; },
    // recolour pixels that are already painted (optionally only some parts)
    tint(test, hex, tone = 1, parts = null) { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (col[i] && (!parts || parts.includes(part[i])) && test(x + 0.5, y + 0.5, x, y)) { col[i] = typeof hex === 'string' ? KK(hex)[tone] : hex; if (typeof hex === 'string') hx[i] = hex; } } return S; },
    erase(test) { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (test(x + 0.5, y + 0.5)) { const i = y * W + x; col[i] = null; hx[i] = null; part[i] = -1; } return S; },
    // simple top light / bottom shade on the given parts
    rim(parts, top = true, bottom = true) {
      const c2 = col.slice();
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = y * W + x; if (!col[i] || !parts.includes(part[i]) || !hx[i]) continue;
        const up = y > 0 ? part[i - W] : -1, dn = y < H - 1 ? part[i + W] : -1;

        else if (bottom && dn === -1) c2[i] = KK(hx[i])[0];
      }
      for (let i = 0; i < N; i++) col[i] = c2[i]; return S;
    },
    finish(main, seams = []) {
      const res = col.map(c => c ? [...c, 255] : null);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const nb = [[0, 1], [0, -1], [1, 0], [-1, 0]].map(([dx, dy]) => { const x2 = x + dx, y2 = y + dy; return x2 < 0 || y2 < 0 || x2 >= W || y2 >= H ? -1 : y2 * W + x2; });
        if (!col[i]) { let best = null; for (const j of nb) if (j >= 0 && col[j] && LUM(col[j]) < LUM(best)) best = col[j]; if (best) res[i] = [...lineCol(best, 'self', main ? KK(main)[1] : null), 255]; continue; }
        if (seams.includes(part[i])) { const j = nb.find(j => j >= 0 && col[j] && part[j] !== part[i]); if (j != null) res[i] = [...lineCol(LUM(col[j]) < LUM(col[i]) ? col[j] : col[i], 'self'), 255]; }
      }
      S.res = res; return S;
    },
    set(x, y, c, onlyFilled = true) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return; const i = y * W + x; if (onlyFilled && part[i] < 0) return; S.res[i] = [...c, 255]; },
    line(pts, c) { // 1px polyline, drawn on top (used for antennae, whiskers)
      for (let k = 0; k < pts.length - 1; k++) { const [x0, y0] = pts[k], [x1, y1] = pts[k + 1]; const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 1.5)); for (let s = 0; s <= n; s++) S.set(x0 + (x1 - x0) * s / n - 0.5, y0 + (y1 - y0) * s / n - 0.5, c, false); }
      return S;
    },
    eye(cx, cy, size, expr) { const st = BEAN[size][expr] || BEAN[size].normal; const ew = st[0].length, eh = st.length; const ex = Math.round(cx - ew / 2), ey = Math.round(cy - eh / 2); st.forEach((row, j) => [...row].forEach((ch, k) => { if (ch !== '.') S.set(ex + k, ey + j, ch === 'h' ? [255, 255, 255] : OUT); })); return { ex, ey, ew, eh }; },
    blush(x, y, n = 2, expr) { if (expr === 'scared') return S; for (let k = 0; k < n; k++) S.set(x + k, y, [255, 140, 170]); return S; },
    mouth(pts, expr, hex) { const c = lineCol(KK(hex)[1], 'self'); if (expr === 'hungry') { const [x, y] = pts[Math.floor(pts.length / 2)]; [[-1, 0], [0, 0], [1, 0], [-1, 1], [1, 1], [0, 2]].forEach(([dx, dy]) => S.set(x + dx, y + dy, OUT)); S.set(x, y + 1, [230, 90, 110]); return S; } pts.forEach(([x, y]) => S.set(x, y, c)); return S; },
    out() { const px = []; for (let y = 0; y < H; y++) px.push(S.res.slice(y * W, y * W + W)); return { w: W, h: H, px }; },
  };

// Pre-rendered sprite images: pixels are painted once, then blitted with drawImage every frame
const _imgCache=new Map();
function spriteImg(key,sp,sc){
  const k=key+'@'+sc;let c=_imgCache.get(k);
  if(!c){
    let mw=sp.w,mh=sp.h;sp.p.forEach(([x,y])=>{if(x+1>mw)mw=x+1;if(y+1>mh)mh=y+1;});
    c=document.createElement('canvas');c.width=mw*sc;c.height=mh*sc;
    const x2=c.getContext('2d');sp.p.forEach(([x,y,col])=>{x2.fillStyle=col;x2.fillRect(x*sc,y*sc,sc,sc);});
    _imgCache.set(k,c);
  }
  return c;
}
/* ── Fitted previews (v2.4) ────────────────────────────────────────────
   Every picture outside the tank is trimmed to its real pixels and placed in a
   fixed-size box: centred left-right, and either centred (swimmers) or sitting on
   the bottom edge (plants, decor, bottom-dwellers). One pixel size per context,
   so nothing is stretched to "fill" and every card/row lines up.            */
const _pvCache=new Map();
function trimCanvas(c){
  const w=c.width,h=c.height;if(!w||!h)return c;
  const d=c.getContext('2d').getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return c;
  const t=document.createElement('canvas');t.width=x1-x0+1;t.height=y1-y0+1;
  t.getContext('2d').drawImage(c,x0,y0,t.width,t.height,0,0,t.width,t.height);
  return t;
}
// kind: 'f' fish, 'c' critter, 'p' plant, 'd' decoration
function previewSrc(kind,id,sc,o){
  o=o||{};
  const key=kind+':'+id+'@'+sc+'|'+(o.stage||'')+'|'+(kind==='p'?o.W+'x'+o.H:'');
  let t=_pvCache.get(key);if(t)return t;
  if(kind==='f'){const b=o.stage==='baby';t=trimCanvas(artCanvas(artData(b?'b':'f',id,0,'normal',true),(b?'b:':'f:')+id+':0:normal',sc));}
  else if(kind==='c')t=trimCanvas(artCanvas(artData('c',id,0,'normal',true),'c:'+id+':0:normal',sc));
  else if(kind==='d')t=trimCanvas(decoImg(id,sc));
  else{
    // plants are procedural: grow a full-size plant, shrink the height budget until it fits the box
    const form=PLANT_FORM[id]||{};const W=o.W,H=o.H;
    let h=form.type==='ball'?999:form.type==='mound'?H*0.55/form.hMul:form.type==='leaves'?H*0.95/form.hMul:H*0.95/(form.hMul||1);
    for(let i=0;i<10;i++){
      const c=document.createElement('canvas');c.width=W*2;c.height=H*2;
      const pcx=c.getContext('2d',{willReadFrequently:true});
      drawPlantShape(pcx,{id,maxH:999,swayOff:1.7,d:0.5,_preview:true},0,c.height-sc*2,sc,h,Math.round(W/sc)*sc);
      outlinePixels(pcx,c.width,c.height,sc);
      t=trimCanvas(c);
      if(t.width<=W&&t.height<=H)break;
      h*=0.88;
    }
  }
  _pvCache.set(key,t);return t;
}
function fitPreview(kind,id,W,H,sc,o){
  o=o||{};
  // one pixel size per box; a sprite that is too big drops to the next whole pixel size, never a blurry scale
  let ps=sc,t=previewSrc(kind,id,ps,Object.assign({W,H},o));
  while(kind!=='p'&&ps>1&&(t.width>W||t.height>H)){ps--;t=previewSrc(kind,id,ps,Object.assign({W,H},o));}
  const c=document.createElement('canvas');c.width=W;c.height=H;
  c.style.width=W+'px';c.style.height=H+'px';c.style.imageRendering='pixelated';c.style.display='block';
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const bottom=o.bottom!=null?o.bottom:(kind==='d'||kind==='p'||(kind==='c'&&!!CREATURES_DEF.find(d=>d.id===id)?.benthic));
  let w=t.width,h=t.height;
  if(w>W||h>H){const k=Math.min(W/w,H/h);w=Math.floor(w*k);h=Math.floor(h*k);}// safety net only — boxes are sized so this never triggers
  x.drawImage(t,0,0,t.width,t.height,Math.floor((W-w)/2),bottom?H-h:Math.floor((H-h)/2),w,h);
  return c;
}

var _noSaveOnUnload=false;
function sv(){if(_noSaveOnUnload)return;try{S.lastSeen=Date.now();localStorage.setItem('aq8',JSON.stringify(S));}catch(e){}}
function ld(){
  try{const x=localStorage.getItem('aq8');window._freshGame=!x;if(x){Object.assign(S,JSON.parse(x));S.waterTested=true;}}catch(e){}
  // v2.2 migration: plant x used to be stored in canvas pixels; now a 0–1 fraction like decorations
  const tw=(document.querySelector('.tank-outer')||{}).clientWidth||360;
  (S.plantSeeds||[]).forEach(p=>{if(p.x>1.5)p.x=Math.min(0.97,Math.max(0.03,p.x/tw));});
  if(!Array.isArray(S.bubbles))S.bubbles=[];
  // v2.3 migration: collection book starts with everything already owned; existing players skip the tutorial
  if(!S.seen){S.seen={f:{},c:{},p:{},d:{}};(S.fish||[]).forEach(f=>{S.seen[f.isCreature?'c':'f'][f.id]=true;});(S.plantSeeds||[]).forEach(p=>{S.seen.p[p.id]=true;});(S.decos||[]).forEach(d=>{S.seen.d[d.id]=true;});}
  if(S.tut==null){S.tut=0;S.tutDone=!!((S.fish&&S.fish.length)||(S.day||1)>1);}
  // v2.6 migration: real-clock time. Old "game days" were real hours, so a fish's age becomes its birth time.
  const _now=Date.now();
  const _base=S.lastSeen||_now;(S.fish||[]).forEach(f=>{if(!f.born)f.born=_base-(f.age||0)*3600000;if(f.joy==null)f.joy=70;});
  if(!S.lastDate)S.lastDate=todayStr();
  if(S._waterChangeCooldown>0&&!S.waterReadyAt)S.waterReadyAt=_now+Math.min(12,S._waterChangeCooldown*4)*3600000;
  delete S._waterChangeCooldown;
}
function coin(n,quiet){if(n>0)S.totalEarned=(S.totalEarned||0)+n;if(n<0)S.totalSpent=(S.totalSpent||0)+Math.abs(n);S.coins+=n;document.getElementById('CD').textContent='Coins: '+S.coins;if(n>0&&!quiet)coinFlyAnim('+'+n);sv();checkAch();}
function addXP(n){S.xp=(S.xp||0)+n;const need=S.level*100;if(S.xp>=need){S.xp-=need;S.level++;showAl('global','⭐ Level Up! Level '+S.level+'! +25 coins','ok');coin(25);}document.getElementById('LD').textContent='Lv. '+S.level;sv();}
function coinFlyAnim(text){const el=document.createElement('div');el.className='coin-fly';el.textContent=text;const cd=document.getElementById('CD');const r=cd.getBoundingClientRect();el.style.left=(r.left+r.width/2)+'px';el.style.top=Math.max(8,r.top-5)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1000);}
// Big events go to a toast pinned at the top so they're seen wherever the player has scrolled
function toast(m,t){
  if(Date.now()<_quietUntil){setTimeout(()=>toast(m,t),_quietUntil-Date.now()+150);return;}
  const box=document.getElementById('toasts');if(!box)return;
  const el=document.createElement('div');el.className='toast '+(t||'ok');el.textContent=m;box.appendChild(el);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},2800);
}
let _quietToasts=null;// while catching up offline, collect messages for the summary instead of spamming toasts
function showAl(z,m,t){
  if(!z||z==='global'){if(_quietToasts){_quietToasts.push(m);return;}toast(m,t);return;}
  const el=document.getElementById('a-'+z);if(!el)return;el.innerHTML='<div class="al '+t+'">'+m+'</div>';setTimeout(()=>{if(el)el.innerHTML='';},3000);
}
function getTankCap(){return TANK_SIZES[S.tankSize||0].capacity;}
function avgW(){const v=Object.values(S.waterScore||{});if(!v.length)return 0;return Math.round(v.reduce((a,b)=>a+b,0)/v.length);}
function getWaterTemp(){return S.owned.heater2?27:S.owned.heater?25:18;}
function getDef(f){return f.isCreature?CREATURES_DEF.find(d=>d.id===f.id):FISH_DEF.find(d=>d.id===f.id);}
function getFishMood(f){
  if(f.weak)return'weak';
  const def=getDef(f);
  if(f.hunger<(def?.personality==='greedy'?40:25))return'hungry';
  if(f.health<40||f.diseased)return'scared';
  if(!isAwake(f))return'sleepy';
  if(def?.personality==='sensitive'&&avgW()<70)return'scared';
  if(f.joy!=null&&f.joy<25)return'lonely';
  // Social moods
  if(def?.social==='schooling'){
    const sameSpecies=S.fish.filter(x=>x.id===f.id&&x.uid!==f.uid).length;
    if(sameSpecies===0)return'lonely';
  }
  if(def?.social==='solitary'){
    const nearby=S.fish.filter(x=>x.uid!==f.uid).length;
    if(nearby>0&&Math.random()<0.1)return'warning';// irritated by company
  }
  if(f.hunger>80&&f.health>80&&(f.joy==null||f.joy>=60))return'happy';
  if(def?.personality==='playful')return'playful';
  return'content';
}

function checkAch(){ACHIEVEMENTS.forEach(a=>{if((S.achievements||[]).includes(a.id))return;if(a.check(S)){if(!S.achievements)S.achievements=[];S.achievements.push(a.id);coin(a.reward);addXP(20);showAchPopup(a);sv();}});}

function recalcWater(){
  const pp=Math.round(S.poopLevel*0.4);
  const fb=(S.owned.filter2?35:S.owned.filter?25:0);
  const pb=Math.min(15,Math.floor((S.plantSeeds||[]).length*2));
  const co2=S.owned.co2?12:0;
  S.waterScore={
    ph:     Math.min(100,Math.max(0,80+(S.owned.filter||S.owned.filter2?5:0)+pb+co2-pp)),
    ammonia:Math.min(100,Math.max(0,65+fb+pb-Math.round(pp*1.2))),
    oxygen: Math.min(100,Math.max(0,45+(S.owned.airpump2?45:S.owned.airpump?30:0)+(S.owned.filter||S.owned.filter2?10:0)+pb)),
    temp:   Math.min(100,Math.max(0,55+(S.owned.heater2?40:S.owned.heater?32:0))),
    clarity:Math.min(100,Math.max(0,50+fb+(S.owned.gravel?18:0)-pp)),
  };
  Object.keys(S.waterScore).forEach(k=>{S.waterScore[k]=Math.round(S.waterScore[k]);});
  renderWaterBar();
}

function renderWaterBar(){
  const el=document.getElementById('wq-bar');if(!el)return;
  if(!S.waterAdded){el.innerHTML='';return;}
  const ws=S.waterScore;if(!ws||!Object.keys(ws).length)return;
  const lbls={ph:'pH',ammonia:'NH₃',oxygen:'O₂',temp:'Temp',clarity:'Clear'};
  const col=v=>v>=80?'#22a37a':v>=55?'#e08a00':'#e2456b';
  const vals=Object.values(ws);
  const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const wq=avg>=80?'Excellent':avg>=60?'Good':avg>=40?'Poor':'Critical';
  const wc=avg>=80?'#22a37a':avg>=60?'#e08a00':'#e2456b';
  el.innerHTML='<div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:6px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">'
    +'<span style="font-family:var(--pfont);font-size:8px;color:var(--muted);letter-spacing:1px;">WATER QUALITY</span>'
    +'<span style="font-size:13px;color:'+wc+';font-weight:500;">'+wq+' — '+avg+'%</span></div>'
    +'<div style="display:flex;gap:6px;">'
    +Object.keys(ws).map(k=>'<div style="flex:1;text-align:center;">'
      +'<div style="font-size:10px;color:var(--muted);margin-bottom:3px;">'+lbls[k]+'</div>'
      +'<div style="height:6px;background:#f3e8ef;border-radius:10px;overflow:hidden;"><div style="height:100%;width:'+ws[k]+'%;background:'+col(ws[k])+';border-radius:10px;transition:width .6s;"></div></div>'
      +'</div>').join('')
    +'</div></div>';
}

/* Happiness 0–1: fed, healthy, clean water. Happy fish release coin bubbles. */
function fishHappy(f){
  if(!S.waterAdded)return 0;
  const hf=Math.min(1,(f.hunger||0)/50);
  const hp=(f.health||0)/100;
  const wf=Math.min(1,avgW()/70);
  if(f.weak)return 0;
  const jf=0.55+0.45*Math.min(1,(f.joy==null?70:f.joy)/100);// happier fish (petted, played with) make more bubbles
  return Math.max(0,Math.min(hf,hp)*wf*jf*(f.diseased?0.2:1));
}
function tankMood(){if(!S.fish.length)return 0;return Math.round(S.fish.reduce((a,f)=>a+fishHappy(f),0)/S.fish.length*100);}

function buyEquipment(id){
  const e=EQ.find(x=>x.id===id);
  if(!e||S.owned[id])return;
  if(S.coins<e.price){toast('Not enough coins for '+e.name,'warn');return;}
  coin(-e.price);S.owned[id]=true;addXP(10);sv();recalcWater();
  toast('Got '+e.name+'!','ok');renderShop();renderHUD();renderSetup();checkAch();tutCheck();
  if(id==='filter'||id==='filter2')startAmbient();
}

function getMarketRares(){
  const refreshDay=Math.floor(S.day/2)*2;
  if(S._marketRareDay!==refreshDay||!S._marketRares){
    S._marketRareDay=refreshDay;
    const rares=FISH_DEF.filter(f=>f.rarity==='rare'||f.rarity==='super_rare');
    S._marketRares=[];
    rares.forEach(r=>{if(Math.random()<(r.rarity==='super_rare'?0.25:0.5))S._marketRares.push(r.id);});
    if(!S._marketRares.length)S._marketRares=[rares[0].id];
    sv();
  }
  return S._marketRares;
}

function renderPlants(){
  const rareIds=getPlantRares();
  const nextRefresh=Math.floor(S.day/2)*2+2;
  document.getElementById('plant-note').textContent='Rare plants refresh on Day '+nextRefresh+'. Plants improve water quality!';
  const avail=[...PLANTS_DEF.filter(p=>p.rarity==='common'||p.rarity==='uncommon'),...PLANTS_DEF.filter(p=>rareIds.includes(p.id))];
  const grid=document.getElementById('plant-g');grid.innerHTML='';
  avail.forEach(p=>{
    const count=(S.plantSeeds||[]).filter(x=>x.id===p.id).length;
    const div=shopCard(fitPreview('p',p.id,120,80,2),rarityTag(p.rarity)+(count>0?'<span class="owned">✓ ×'+count+' growing</span>':''),
      '<div class="iname">'+p.name+'</div><div class="idesc">'+p.desc+'</div>'+
      '<div class="iprice">'+p.price+' coins</div>',
      '<button data-plant="'+p.id+'" '+(S.coins<p.price?'disabled':'')+'>Plant</button>');
    grid.appendChild(div);
  });
  grid.querySelectorAll('[data-plant]').forEach(btn=>{
    btn.addEventListener('click',function(){
      const id=this.dataset.plant;const pdef=PLANTS_DEF.find(x=>x.id===id);
      if(!pdef||S.coins<pdef.price)return;
      coin(-pdef.price);addXP(5);
      if(!S.plantSeeds)S.plantSeeds=[];
      const W=document.getElementById('TC').width||600;
      // Smart placement: maximise distance from existing plants AND decos
      const occupied=[];
      (S.plantSeeds||[]).forEach(p=>occupied.push(p.x));
      (S.decos||[]).forEach(d=>occupied.push(d.x));
      const candidates=40;let bestX=0.05+Math.random()*0.88;let bestScore=-1;
      for(let i=0;i<candidates;i++){
        const cx=0.05+Math.random()*0.88;
        const minDist=occupied.length?Math.min(...occupied.map(ox=>Math.abs(cx-ox))):1;
        if(minDist>bestScore){bestScore=minDist;bestX=cx;}
      }
      // depth: same species share one depth zone; new species get emptiest zone
      const depthZones=[0.2,0.5,0.8];
      const existingSame=(S.plantSeeds||[]).find(x=>x.id===id);
      let plantDepth;
      if(existingSame){
        plantDepth=existingSame.d||0.5;
      } else {
        const usedDepths=(S.plantSeeds||[]).map(x=>x.d||0.5);
        let bestZone=0.5,bestZoneScore=-1;
        depthZones.forEach(z=>{const minD=usedDepths.length?Math.min(...usedDepths.map(ud=>Math.abs(ud-z))):1;if(minD>bestZoneScore){bestZoneScore=minD;bestZone=z;}});
        plantDepth=bestZone;
      }
      // maxH × 0.8 (20% smaller overall)
      S.plantSeeds.push({id,x:bestX,maxH:(40+Math.random()*60)*0.8,swayOff:Math.random()*Math.PI*2,d:plantDepth});
      sv();recalcWater();showAl('plants',pdef.name+' planted!','ok');renderPlants();renderMine();checkAch();gameEvent('plant',{id});
    });
  });
}

function animateClean(){
  const canvas=document.getElementById('TC');if(!canvas)return;
  const overlay=document.createElement('canvas');
  overlay.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;';
  overlay.width=canvas.width;overlay.height=canvas.height;
  canvas.parentElement.appendChild(overlay);
  const ctx2=overlay.getContext('2d');
  const W=canvas.width;const H=canvas.height;
  let frame=0;const totalFrames=90;
  // Scrubbing bubbles sweep L→R
  function tick(){
    ctx2.clearRect(0,0,W,H);
    const progress=frame/totalFrames;
    // Blue wash sweep
    ctx2.save();ctx2.globalAlpha=0.18*Math.sin(Math.PI*progress);
    ctx2.fillStyle='#ffffff';ctx2.fillRect(0,0,W*progress*1.1,H);ctx2.restore();
    // Scrub bubbles along the sweep line
    const sweepX=W*progress;
    for(let i=0;i<12;i++){
      const bx=sweepX-(Math.random()*40);
      const by=20+Math.random()*(H-40);
      const r=3+Math.random()*6;
      ctx2.save();ctx2.globalAlpha=0.5+Math.random()*0.4;
      ctx2.strokeStyle='#ffffff';ctx2.lineWidth=1.5;
      ctx2.beginPath();ctx2.arc(bx,by,r,0,Math.PI*2);ctx2.stroke();
      ctx2.restore();
    }
    // Sparkles trailing the sweep
    for(let i=0;i<8;i++){
      const sx=sweepX-Math.random()*80;const sy=Math.random()*H;
      ctx2.save();ctx2.globalAlpha=0.8;ctx2.fillStyle='#ffffff';
      ctx2.fillRect(sx,sy,2,2);ctx2.restore();
    }
    frame++;
    if(frame<=totalFrames)requestAnimationFrame(tick);
    else overlay.remove();
  }
  tick();
}

function animateWaterChange(){
  // Cost & cooldown
  const _wl=(S.waterReadyAt||0)-Date.now();if(_wl>0){showAl('manage','Fresh water went in recently — next water change in '+fmtDur(_wl)+'.','warn');return;}
  const canvas=document.getElementById('TC');if(!canvas)return;
  const W=canvas.width;const H=canvas.height;
  const overlay=document.createElement('canvas');
  overlay.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;';
  overlay.width=W;overlay.height=H;
  canvas.parentElement.appendChild(overlay);
  const ctx2=overlay.getContext('2d');
  let frame=0;const totalFrames=140;
  function tick(){
    ctx2.clearRect(0,0,W,H);
    const p=frame/totalFrames;
    if(p<0.5){
      // Phase 1: water drains downward (dark blue receding)
      const drainH=H*(1-p*2);
      ctx2.save();ctx2.globalAlpha=0.45;
      ctx2.fillStyle='#7fc9d6';ctx2.fillRect(0,H-drainH,W,drainH);
      // drain ripples
      ctx2.strokeStyle='#ffffff';ctx2.lineWidth=1;ctx2.globalAlpha=0.3;
      for(let i=0;i<5;i++){
        ctx2.beginPath();ctx2.moveTo(0,H-drainH+(i*12));ctx2.lineTo(W,H-drainH+(i*12)+Math.sin(frame*0.3+i)*6);ctx2.stroke();
      }
      ctx2.restore();
    } else {
      // Phase 2: fresh water fills from bottom up
      const fillH=H*((p-0.5)*2);
      ctx2.save();ctx2.globalAlpha=0.5;
      ctx2.fillStyle='#a6e6ee';ctx2.fillRect(0,H-fillH,W,fillH);
      // fill ripples & bubbles
      ctx2.strokeStyle='#ffffff';ctx2.lineWidth=2;ctx2.globalAlpha=0.6;
      for(let i=0;i<4;i++){
        ctx2.beginPath();ctx2.moveTo(0,H-fillH+(i*14));ctx2.lineTo(W,H-fillH+(i*14)+Math.sin(frame*0.4+i)*8);ctx2.stroke();
      }
      // rising bubbles
      ctx2.globalAlpha=0.8;ctx2.strokeStyle='#ffffff';ctx2.lineWidth=1.5;
      for(let i=0;i<10;i++){
        const bx=Math.random()*W;const by=H-fillH-((frame*3+i*35)%(fillH||1));
        ctx2.beginPath();ctx2.arc(bx,Math.max(0,by),2+Math.random()*3,0,Math.PI*2);ctx2.stroke();
      }
      ctx2.restore();
    }
    frame++;
    if(frame<=totalFrames)requestAnimationFrame(tick);
    else{
      overlay.remove();
      // Apply water change effects
      S.poopLevel=0;
      S.fish.forEach(f=>{f.health=Math.min(100,f.health+15);f.hunger=Math.min(100,f.hunger+10);checkWeak(f);});
      S.waterReadyAt=Date.now()+12*HOUR;
      recalcWater();sv();renderFishList();renderHUD();
      showAl('manage','Fresh water! Fish feel great!','ok');gameEvent('water');
    }
  }
  tick();
}

/* ── Procedural pixel plants ─────────────────────────────────────────
   Every species gets a real silhouette; all cells snap to the sc grid so
   plants share the same 3px pixel size as fish and decorations.
   Shapes are seeded from swayOff, so each plant keeps its own look.   */
const PLANT_FORM={
  vallis:     {type:'blades',n:[5,7],hMul:1.0},
  pogostemon: {type:'blades',n:[4,6],hMul:0.8,tips:true},
  moss:       {type:'mound',hMul:0.28,wMul:1.5},
  utricularia:{type:'mound',hMul:0.22,wMul:1.8,sprigs:true},
  amazon:     {type:'leaves',n:[5,7],hMul:0.78,pet:0.34,wid:0.10,spread:0.95},
  anubias:    {type:'leaves',n:[4,5],hMul:0.36,pet:0.30,wid:0.24,spread:1.15},
  lotus:      {type:'leaves',n:[4,6],hMul:0.36,pet:0.40,wid:0.20,spread:1.15},
  buce:       {type:'leaves',n:[6,8],hMul:0.26,pet:0.10,wid:0.28,spread:1.3},
  crypt:      {type:'leaves',n:[6,7],hMul:0.40,pet:0.14,wid:0.16,spread:1.2},
  tiger:      {type:'leaves',n:[4,6],hMul:0.36,pet:0.36,wid:0.22,spread:1.15,spots:true},
  cabomba:    {type:'feather',hMul:0.9},
  hornwort:   {type:'feather',hMul:0.85},
  marimo:     {type:'ball'},
};
function plantRng(seed){let s=(Math.floor(seed*99991)|0)^0x5bd1e995;return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

// cx = centre x in px, baseY = root y in px, h = full-grown height budget in px
function drawPlantShape(ctx,p,t,baseY,sc,h,cx){
  const U=3;// size unit (px): shapes keep their v2.4 size while cells follow the finer grid
  const pc=PLANT_COLORS[p.id]||PLANT_COLORS.vallis;
  const form=PLANT_FORM[p.id]||PLANT_FORM.vallis;
  const R=plantRng(p.swayOff||1);
  const g=v=>Math.round(v/sc)*sc;
  const cell=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(g(x),g(y),sc,sc);};
  const amp=(p._preview?0:1)*(2+(p.d||0.5)*3);
  const sway=(f,ph)=>Math.sin(t*0.8+(p.swayOff||0)+ph)*amp*Math.pow(f,1.4);
  const ph=h*(form.hMul||1);

  if(form.type==='blades'){
    const n=form.n[0]+Math.floor(R()*(form.n[1]-form.n[0]+1));
    for(let i=0;i<n;i++){
      const bh=ph*(0.55+0.45*R());
      const lean=(R()-0.5)*0.45;
      const off=(i-(n-1)/2)*U*1.2;
      const shade=i%2;
      for(let y=0;y<bh;y+=sc){
        const f=y/bh;
        const x=cx+off+lean*y+sway(f,i*0.7);
        const c=f<0.12?pc.stem:f>0.86?pc.leaf[2]:pc.leaf[shade?0:1];
        cell(x,baseY-y-sc,c);
        if(form.tips&&f>0.6&&((y/sc)|0)%3===0){cell(x-sc,baseY-y-sc,pc.leaf[2]);cell(x+sc,baseY-y-sc,pc.leaf[1]);}
      }
    }
    return;
  }

  if(form.type==='mound'){
    const mh=Math.max(U*3,ph);const half0=ph*form.wMul/2+U*2;
    for(let y=0;y<mh;y+=sc){
      const f=y/mh;const half=half0*Math.sqrt(Math.max(0,1-f*f));
      const sx=sway(f,0)*0.4;
      const x0=g(cx-half+sx),x1=g(cx+half+sx);
      ctx.fillStyle=f<0.3?pc.stem:pc.leaf[0];ctx.fillRect(x0,g(baseY-y-sc),Math.max(sc,x1-x0),sc);
      // speckled highlights for a fluffy look
      for(let x=x0;x<x1;x+=sc){const r=R();if(r<0.28)cell(x,baseY-y-sc,pc.leaf[f>0.5?2:1]);else if(r>0.93)cell(x,baseY-y-sc,pc.stem);}
      // ragged top edge
      if(f>0.75){const r=R();if(r<0.5)cell(x0-sc,baseY-y-sc,pc.leaf[1]);}
    }
    if(form.sprigs){
      const k=4+Math.floor(R()*4);
      for(let i=0;i<k;i++){const sx=cx+(R()-0.5)*half0*1.4;const sh=U*(2+Math.floor(R()*3));for(let y=0;y<sh;y+=sc)cell(sx+sway(1,i),baseY-mh-y-sc,pc.leaf[2]);}
    }
    return;
  }

  if(form.type==='leaves'){
    const n=form.n[0]+Math.floor(R()*(form.n[1]-form.n[0]+1));
    // draw outer leaves first so the middle ones sit in front
    const order=[...Array(n).keys()].sort((a,b)=>Math.abs(b-(n-1)/2)-Math.abs(a-(n-1)/2));
    order.forEach(i=>{
      const a=-form.spread+2*form.spread*(n>1?i/(n-1):0.5)+(R()-0.5)*0.2;
      const L=ph*(0.65+0.35*(1-Math.abs(a)/1.4))*(0.85+R()*0.3);
      const pL=L*form.pet;const Wm=L*form.wid;
      const dx=Math.sin(a),dy=-Math.cos(a);
      const vertical=Math.abs(a)<0.8;
      const alt=i%2===0;const lite=alt?pc.leaf[2]:pc.leaf[1];const dark=alt?pc.leaf[1]:pc.leaf[0];
      for(let s=0;s<L;s+=sc*0.8){
        const hf=Math.max(0,-dy)*s/ph;// how high this point sits
        const px=cx+dx*s+sway(Math.min(1,s/L),i*0.6);
        const py=baseY+dy*s;
        if(s<pL){cell(px,py-sc,pc.stem);continue;}
        const u=(s-pL)/(L-pL);
        const w=Math.max(sc*0.6,Wm*Math.pow(Math.sin(Math.PI*Math.min(1,u*1.05)),0.75));
        if(vertical){
          const hw=w/Math.max(0.55,Math.cos(a));
          const x0=g(px-hw),x1=g(px+hw),xm=g(px);
          ctx.fillStyle=lite;ctx.fillRect(x0,g(py-sc),Math.max(sc,xm-x0),sc);
          ctx.fillStyle=dark;ctx.fillRect(xm,g(py-sc),Math.max(sc,x1-xm),sc);
          if(u>0.15&&u<0.9)cell(px,py-sc,pc.stem);
        } else {
          const hh=w/Math.max(0.55,Math.abs(Math.sin(a)));
          const y0=g(py-hh),y1=g(py+hh),ym=g(py);
          ctx.fillStyle=lite;ctx.fillRect(g(px),y0-sc,sc,Math.max(sc,ym-y0));
          ctx.fillStyle=dark;ctx.fillRect(g(px),ym-sc,sc,Math.max(sc,y1-ym));
          if(u>0.15&&u<0.9)cell(px,py-sc,pc.stem);
        }
        if(u>0.92)cell(px,py-sc,pc.leaf[2]);
        if(form.spots&&u>0.2&&u<0.85&&R()<0.12)cell(px+(R()-0.5)*w,py-sc,pc.stem);
      }
    });
    return;
  }

  if(form.type==='feather'){
    const fh=ph;
    for(let y=0;y<fh;y+=sc){
      const f=y/fh;const x=cx+sway(f,0);
      cell(x,baseY-y-sc,pc.stem);
      if(((y/sc)|0)%3===1&&f>0.08){
        const span=U*(f<0.85?3+Math.round(2*Math.sin(f*Math.PI)):2);
        const c=pc.leaf[((y/sc)|0)%3===1&&f>0.5?2:f>0.25?1:0];
        for(let k=sc;k<=span;k+=sc){cell(x-k,baseY-y-sc-(k>U*2?sc:0),c);cell(x+k,baseY-y-sc-(k>U*2?sc:0),c);}
      }
    }
    return;
  }

  if(form.type==='ball'){
    // Marimo rests on the sand — no stem — and grows slowly
    const r=Math.max(U*2,Math.min(U*7,h*0.12));
    const cy=baseY-r;
    for(let y=-r;y<r;y+=sc){
      const hw=Math.sqrt(Math.max(0,r*r-(y+sc/2)*(y+sc/2)));
      const x0=g(cx-hw),x1=g(cx+hw);
      ctx.fillStyle=y<-r*0.3?pc.leaf[1]:y>r*0.4?pc.stem:pc.leaf[0];
      ctx.fillRect(x0,g(cy+y),Math.max(sc,x1-x0),sc);
      for(let x=x0;x<x1;x+=sc){if(R()<0.18)cell(x,cy+y,pc.leaf[2]);}
    }
    cell(cx-r*0.4,cy-r*0.45,'#ffffff');cell(cx-r*0.4+sc,cy-r*0.45,'#ffffff');
    return;
  }
}

// Tank wrapper: depth scales height a little (back shorter, front taller); x is stored as a 0–1 fraction.
// Each plant is cached as an image and only redrawn when its (slow) sway moves to the next of 20 steps
// or it grows — so 20 plants cost about what 1 used to.
const _plantImg=new WeakMap();
const SWAY_STEPS=14;
function drawPlant(ctx,p,t,W,H,baseY){
  const sc=ART_SC;
  const depth=p.d||0.5;
  const depthHMult=0.7+depth*0.6;
  const h=getPlantH(p)*3*depthHMult;
  const form=PLANT_FORM[p.id]||{};
  const ph=h*(form.hMul||1);
  const TAU=Math.PI*2;
  const phase=(((t*0.8+(p.swayOff||0))%TAU)+TAU)%TAU;
  const bucket=form.type==='ball'?0:Math.floor(phase/TAU*SWAY_STEPS);
  const key=bucket+'|'+Math.round(h/sc)+'|'+depth;
  const pw=form.type==='ball'?60:Math.ceil((ph*2.4+48)/(sc*2))*sc*2;
  const padB=sc*2,chH=Math.ceil((ph+36)/sc)*sc+padB;
  let c=_plantImg.get(p);
  if(!c||c.width!==pw||c.height!==chH||c._key!==key){
    if(!c||c.width!==pw||c.height!==chH){c=document.createElement('canvas');c.width=pw;c.height=chH;_plantImg.set(p,c);}
    const cx2=c.getContext('2d',{willReadFrequently:true});cx2.clearRect(0,0,pw,chH);
    const tb=((bucket+0.5)/SWAY_STEPS*TAU-(p.swayOff||0))/0.8;// time that reproduces this sway step
    drawPlantShape(cx2,p,tb,chH-padB,sc,h,pw/2);
    outlinePixels(cx2,pw,chH,sc);
    c._key=key;
  }
  const gx=Math.round(p.x*W/sc)*sc,gy=Math.round(baseY/sc)*sc;
  ctx.drawImage(c,gx-pw/2,gy-(chH-padB));
}
