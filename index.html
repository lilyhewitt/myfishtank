function giftIcon(g,s){return pixURL('gf_'+g.id+'_'+(s||3),g.p,g.c,s||3);}
function hidOf(o){if(!o.hid)o.hid=(S.hidSeq=(S.hidSeq||0)+1);return o.hid;}
function itemByHid(h){return(S.decos||[]).find(d=>d.hid===h)||(S.plantSeeds||[]).find(p=>p.hid===h)||null;}
function itemName(o){if(!o)return'';const d=DECO_DEF.find(x=>x.id===o.id)||PLANTS_DEF.find(x=>x.id===o.id);return d?d.name:o.id;}
function homeOf(f){const h=f.home&&itemByHid(f.home);if(f.home&&!h)f.home=null;return h;}

/* ── wishes ── */
function wishFor(f){
  const def=getDef(f)||{};const L=likesOf(f);
  const opts=[];
  if(!(S.decos||[]).some(d=>d.id===L.deco)&&(S.decos||[]).length<getDecoCap())opts.push({type:'deco',id:L.deco,w:3});
  if(!(S.plantSeeds||[]).some(p=>p.id===L.plant))opts.push({type:'plant',id:L.plant,w:2});
  if(def.social==='schooling'&&!f.isCreature&&!S.fish.some(x=>x.id===f.id&&x.uid!==f.uid)&&S.fish.length<getTankCap())opts.push({type:'friend',id:f.id,w:2});
  opts.push({type:'snack',w:1},{type:'play',w:1},{type:'pats',w:1});
  const o=weightedPick(opts);return{type:o.type,id:o.id,t:Date.now(),day:todayStr(),sn:f.snacks||0};
}
function wishText(w){
  if(!w)return'';
  if(w.type==='deco')return'a '+itemName({id:w.id});if(w.type==='plant')return'some '+itemName({id:w.id});
  if(w.type==='friend')return'a friend — another '+((FISH_DEF.find(x=>x.id===w.id)||{}).name||'fish');
  return{snack:'a little snack',play:'a game of ball',pats:'lots of pats (5 today)'}[w.type];
}
function wishIcon(w){return w?{deco:'🏰',plant:'🌿',friend:'🐟',snack:'🍤',play:'⚽',pats:'🤚'}[w.type]:'';}
function wishWhere(w){return w?{deco:'find it in 🏰 Decor',plant:'find it in 🌿 Plants',friend:'find one in 🐟 Fish',snack:'tap the fish → 🍤 Snack',play:'tap the fish → ⚽ Play',pats:'tap the fish to pat it'}[w.type]:'';}
function wishDone(f,w){
  if(!w)return false;
  if(w.type==='deco')return(S.decos||[]).some(d=>d.id===w.id);
  if(w.type==='plant')return(S.plantSeeds||[]).some(p=>p.id===w.id);
  if(w.type==='friend')return S.fish.some(x=>x.id===w.id&&x.uid!==f.uid);
  if(w.type==='snack')return w.day===todayStr()?(f.snacks||0)>w.sn:(f.snacks||0)>0;
  if(w.type==='play')return(f.lastPlay||0)>w.t;
  if(w.type==='pats')return(f.lastPet||0)>w.t&&(f.petsToday||0)>=5;
  return false;
}
function makeWish(f){
  f.wish=wishFor(f);sv();
  const a=fishAnim.find(x=>x.uid===f.uid);if(a&&!a.isBenthic){const c=getSpeciesCfg(a.id,a.isCreature);a.goal={x:44,y:Math.min(c.yMax,Math.max(c.yMin,40)),until:Date.now()+5000,happy:true};}
  say(f,'I wish for '+wishText(f.wish)+'…',6500);
  setTimeout(()=>toast('💭 '+f.name+' made a wish: '+wishText(f.wish)+' ('+wishWhere(f.wish)+')','ok'),800);
  _stripSig='';
}
function wishCome(f){
  const w=f.wish;f.wish=null;f.wishDoneAt=Date.now();f.wishes=(f.wishes||0)+1;
  f.bond=(f.bond||0)+8;f.joy=Math.min(100,(f.joy||70)+20);
  let home=null,picked=false;
  if(w.type==='deco')home=(S.decos||[]).find(d=>d.id===w.id);else if(w.type==='plant')home=(S.plantSeeds||[]).find(p=>p.id===w.id);
  if(!home&&!homeOf(f)){const L=likesOf(f);home=(S.decos||[]).find(d=>d.id===L.deco)||pick([...(S.decos||[]),...(S.plantSeeds||[])].concat([null]));}
  if(home){f.home=hidOf(home);picked=true;}
  sv();_stripSig='';
  const a=fishAnim.find(x=>x.uid===f.uid);if(a&&!a.isBenthic){const c=getSpeciesCfg(a.id,a.isCreature);a.goal={x:44,y:Math.min(c.yMax,Math.max(c.yMin,40)),until:Date.now()+5000,happy:true};a.clickAnim=20;}
  say(f,'My wish came true! ♥',5000);sfx('happy');
  setTimeout(()=>{
    const ph=snapTank(f.name+'\'s wish came true','✨');flashTank();
    surpriseCard({photo:ph,icon:'✨',title:esc(f.name)+'\'s wish came true!',text:'It wished for '+esc(wishText(w))+'.'+(picked?'<br>'+esc(f.name)+' picked the <b>'+esc(itemName(itemByHid(f.home)))+'</b> as its home 🏠 — that\'s where it sleeps at night.':'')+'<br><small>💗 bond +8</small>'});
  },1800);
}

/* ── gifts ── */
function giftFrom(f){const ok=GIFT_ITEMS.filter(g=>!g.bond||(f.bond||0)>=g.bond);return pick(ok.concat(ok.filter(g=>['pebble','shell','glass','heart'].includes(g.id))));}
function dropGift(f,live){
  S.gifts=S.gifts||[];if(S.gifts.length>=4)return null;
  const h=homeOf(f);const x=Math.min(0.92,Math.max(0.08,(h?h.x:0.2+Math.random()*0.6)+(Math.random()-0.5)*0.12));
  const g={g:giftFrom(f).id,from:f.uid,name:f.name,x,d:0.62+Math.random()*0.25,t:Date.now(),y:live?0.35:null};
  S.gifts.push(g);sv();return g;
}
function openGift(g){
  S.gifts=(S.gifts||[]).filter(x=>x!==g);
  const it=GIFT_ITEMS.find(x=>x.id===g.g)||GIFT_ITEMS[0];
  S.shelf=S.shelf||{};S.shelf[it.id]=(S.shelf[it.id]||0)+1;
  const f=S.fish.find(x=>x.uid===g.from);if(f){f.bond=(f.bond||0)+1;}
  sv();
  const ph=snapTank('A gift from '+g.name,'🎁');flashTank();
  const btns=[{id:'gf-ok',label:'♥ Thank you, '+esc(g.name)}];
  if(it.id==='seed')btns.unshift({id:'gf-plant',label:'🌱 Plant it',fn:()=>plantSeed()});
  surpriseCard({photo:ph,iconHTML:'<img class="tr-ic" alt="" src="'+giftIcon(it,4)+'">',title:'🎁 A gift from '+esc(g.name),text:'<b>'+it.name+'</b><br><i>'+it.desc+'</i>',buttons:btns});
  if(f)say(f,'Do you like it? ♥',4500);
}
function plantSeed(){
  const rare=PLANTS_DEF.filter(p=>p.rarity==='rare'||p.rarity==='super_rare');
  const p=pick(rare.filter(r=>!(S.plantSeeds||[]).some(x=>x.id===r.id)).concat(rare.slice(0,1)));
  S.plantSeeds.push({id:p.id,x:0.1+Math.random()*0.8,maxH:(40+Math.random()*60)*0.8,swayOff:Math.random()*Math.PI*2,d:0.3+Math.random()*0.5});
  markSeen('p',p.id);recalcWater();sv();renderMine();
  toast('🌱 A '+p.name+' sprouted from the seed!','ok');gameEvent('plant',{id:p.id});
}
function giftPos(g,W,H,flY){const gg={flY,sandH:H-flY};const by=baseYOf(gg,g.d);return{x:Math.round(g.x*W/2)*2,y:by};}

/* ── accessories ── */
function accsOf(f){return ACCS.filter(a=>(f.bond||0)>=a.bond);}
function accOn(f){const u=accsOf(f);if(f.acc==='none')return null;return u.find(a=>a.id===f.acc)||u[u.length-1]||null;}

EVENTS[3].push(
  {id:'bring',w:3,when:()=>S.fish.some(f=>(f.bond||0)>=6&&isAwake(f)&&!f.isCreature)&&(S.gifts||[]).length<4,
    start:e=>{
      const f=pick(S.fish.filter(f=>(f.bond||0)>=6&&isAwake(f)&&!f.isCreature));e.f=f;
      const a=fishAnim.find(x=>x.uid===f.uid);if(a&&!a.isBenthic){const c=getSpeciesCfg(a.id,a.isCreature);a.goal={x:46,y:Math.min(c.yMax,Math.max(c.yMin,34)),until:Date.now()+5000,happy:true};}
      say(f,'I found something for you!',4500);
      setTimeout(()=>{const g=dropGift(f,true);if(g){g.y=0.4;g.x=Math.min(0.9,Math.max(0.1,a&&a._cx!=null?a._cx/100:0.5));}evEnd();},2600);
    }},
);
SCH[3]={
  tick(){
    const now=Date.now();
    // wishes come true
    S.fish.forEach(f=>{if(f.wish&&wishDone(f,f.wish))wishCome(f);});
    // new accessories
    S.fish.forEach(f=>{const n=accsOf(f).length;if(n>(f.accN||0)){f.accN=n;sv();if(n>0&&now>_quietUntil){const a=ACCS[n-1];setTimeout(()=>{const ph=snapTank(f.name+' got a '+a.name.toLowerCase(),a.ico);flashTank();toast(a.ico+' '+f.name+' is wearing a little '+a.name.toLowerCase()+' now — bond '+a.bond,'ok');},600);}}});
    // a new wish now and then (at most two waiting at once)
    if(now<_quietUntil+6000||_ev||document.querySelector('.modal-bg')||!S.tutDone||_speech)return;
    if(S.fish.filter(f=>f.wish).length>=2)return;
    if(now-(S.lastWishAt||0)<3*60000)return;
    const cand=S.fish.filter(f=>!f.isCreature&&!f.wish&&isAwake(f)&&now-(f.wishDoneAt||0)>18*HOUR&&now-(f.born||now)>20*60000);
    if(cand.length){S.lastWishAt=now;makeWish(pick(cand));}
  },
  goal(a,fish,cfg,t,night,ns){
    if(a.goal||a.isBenthic)return;
    const h=homeOf(fish);if(!h)return;
    const isDeco=!!DECO_DEF.find(x=>x.id===h.id);
    const g=tankGeo();const by=baseYOf(g,h.d);const hh=isDeco?decoImg(h.id,ART_SC).height:50;
    const y=Math.max(cfg.yMin,Math.min(80,(by-hh*0.45)/g.H*100-4));
    if(!isAwake(fish)){if(Math.random()<0.01)a.goal={x:h.x*100-4+(Math.random()-0.5)*4,y,until:Date.now()+60000,deep:true};return;}
    if(Math.random()<0.0006*ns)a.goal={x:h.x*100-4,y,until:Date.now()+8000,happy:true,deep:true};
  },
  drawFront(ctx,W,H,t,flY){
    (S.gifts||[]).forEach(g=>{
      const p=giftPos(g,W,H,flY);
      if(g.y!=null){const ty=p.y/H;g.y=Math.min(ty,g.y+0.0016);if(g.y>=ty)g.y=null;p.y=Math.round(Math.min(p.y,g.y*H)/2)*2;}
      g.px=p.x;g.py=p.y;
      ctx.save();ctx.globalAlpha=0.25+0.15*Math.sin(t*3+g.x*9);ctx.fillStyle='#fff6d0';ctx.beginPath();ctx.ellipse(p.x,p.y-10,20,12,0,0,Math.PI*2);ctx.fill();ctx.restore();
      pix(ctx,GIFT_BOX,p.x-10,p.y-21,3,{b:'#ff8fb8',w:'#ffd0e2',r:'#ffd34d'});
      sparkle(ctx,p.x+12,p.y-24,t,g.x*9);sparkle(ctx,p.x-12,p.y-10,t,g.x*9+2);
    });
  },
  tap(px,py,W,H){
    const g=(S.gifts||[]).find(g=>g.px!=null&&Math.hypot(px-g.px,py-(g.py-10))<26);
    if(!g)return false;openGift(g);return true;
  },
  fishExtra(ctx,a,fish,px,py,img,t,right,cell,hat){
    const s=cell||2;const acc=hat?null:accOn(fish);// a party / holiday hat replaces it for the day
    const top=spriteTop(img,right?0.7:0.3);const hx=px+(right?img.width*0.68:img.width*0.32);
    if(acc){const w=acc.p[0].length*s;pix(ctx,acc.p,Math.round(hx-w/2),Math.round(py+top-acc.p.length*s+s),s,acc.c,right);}
    if(a&&fish.wish&&isAwake(fish)&&((t+fish.uid*1.7)%9)<3&&a.uid!==petUid){
      const bx=Math.round((px+img.width/2+(right?-14:14))/2)*2,by=Math.round((py+top-26)/2)*2;
      ctx.save();ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(bx-11,by-9,22,18);ctx.fillRect(bx-9,by-11,18,22);
      ctx.fillRect(bx+(right?8:-10),by+12,4,4);ctx.fillRect(bx+(right?12:-14),by+18,2,2);
      {const wc=pxiCanvas(PXI_MAP[wishIcon(fish.wish)]);if(wc)ctx.drawImage(wc,bx-6,by-6);}ctx.restore();
    }
  },
  away(away,ms){
    if(ms<2*HOUR)return;
    const hrs=Math.min(1,ms/(4*HOUR));away.gifts=[];
    S.fish.forEach(f=>{if((f.bond||0)<5)return;const p=Math.min(0.55,0.12+(f.bond||0)/120)*hrs;if(Math.random()<p){const g=dropGift(f,false);if(g)away.gifts.push(g);}});
    // after a long time away, your closest friend almost always has something for you
    if(!away.gifts.length&&ms>=6*HOUR&&Math.random()<0.75){const best=S.fish.slice().sort((a,b)=>(b.bond||0)-(a.bond||0))[0];if(best&&(best.bond||0)>=10){const g=dropGift(best,false);if(g)away.gifts.push(g);}}
  },
  diary(away){
    const L=[];
    (away.gifts||[]).slice(0,2).forEach(g=>L.push({icon:'🎁',text:g.name+' left you a little gift on the sand.',f:g.from,p:1.5}));
    const hf=S.fish.filter(f=>homeOf(f));if(hf.length&&away.nightMostly){const f=pick(hf);L.push({icon:'🏠',text:f.name+' slept snug by its home, the '+itemName(homeOf(f)).toLowerCase()+'.',f:f.uid,p:6});}
    const wf=S.fish.filter(f=>f.wish);if(wf.length){const f=pick(wf);L.push({icon:'💭',text:f.name+' is still dreaming of '+wishText(f.wish)+'.',f:f.uid,p:5});}
    return L;
  },
  petHTML(f){
    const h=homeOf(f);const acc=accsOf(f);const on=accOn(f);
    let s='<div class="ps-x3">';
    s+=f.wish?'<div class="ps-wish">💭 Wishes for <b>'+esc(wishText(f.wish))+'</b> <small>('+wishWhere(f.wish)+')</small></div>':(f.isCreature?'':'<div class="ps-wish q">💭 No wish right now'+(f.wishes?' · ✨ '+f.wishes+' granted':'')+'</div>');
    if(h)s+='<div class="ps-wish">🏠 Home: <b>'+esc(itemName(h))+'</b></div>';
    s+='<div class="ps-acc">'+ACCS.map(a=>(f.bond||0)>=a.bond?'<button class="acc'+(on&&on.id===a.id?' on':'')+'" data-acc="'+a.id+'">'+a.ico+'</button>':'<span class="acc q" title="bond '+a.bond+'">'+a.ico+'<small>'+a.bond+'</small></span>').join('')+(acc.length?'<button class="acc'+(!on?' on':'')+'" data-acc="none">✕</button>':'')+'</div></div>';
    return s;
  },
  petSig(f){return[f.wish&&f.wish.type+f.wish.id,f.home,f.acc,accsOf(f).length,f.wishes].join(',');},
  strip(f){return f.wish?'<span class="sc-w">💭</span>':'';},
  albumTop(){
    const sh=S.shelf||{};const n=GIFT_ITEMS.filter(g=>sh[g.id]).length;const granted=S.fish.reduce((a,f)=>a+(f.wishes||0),0);
    return'<div class="al-h"><span>🧺 Gift shelf</span><small>'+n+'/'+GIFT_ITEMS.length+'</small></div><div class="shelf">'
      +GIFT_ITEMS.map(g=>sh[g.id]?'<div class="sh-it"><img alt="" src="'+giftIcon(g,4)+'"><span>'+g.name+(sh[g.id]>1?' ×'+sh[g.id]:'')+'</span></div>':'<div class="sh-it q"><b>?</b><span>'+(g.bond?'bond '+g.bond+'+':'???')+'</span></div>').join('')+'</div>'
      +'<div class="refresh-note">✨ Wishes granted: '+granted+' · Fish you\'re close to leave gifts while you\'re away.</div>';
  },
};
// the close-up sheet: pick which accessory a fish wears
document.addEventListener('click',e=>{const b=e.target.closest('[data-acc]');if(!b||petUid==null)return;const f=S.fish.find(x=>x.uid===petUid);if(!f)return;f.acc=b.dataset.acc;sv();renderPet(true);sfx('tap');});


// New players start with a tank that's already alive: water, two plants and a baby goldfish who says hi.
function starterTank(){
  const now=Date.now();
  S.owned.filter=true;S.owned.heater=true;S.owned.gravel=true;
  S.waterAdded=true;S.waterLevel=100;S.waterAnim=false;S.coins=400;
  S.fish.push({id:'goldfish',name:'Mochi',health:100,hunger:70,joy:80,born:now,age:0,stage:'baby',diseased:false,disease:null,uid:++S.uid});
  S.plantSeeds.push({id:'vallis',x:0.16,maxH:70,swayOff:1.3,d:0.2},{id:'moss',x:0.78,maxH:40,swayOff:4.1,d:0.5});
  S.seen=S.seen||{f:{},c:{},p:{},d:{}};S.seen.f.goldfish=true;S.seen.p.vallis=true;S.seen.p.moss=true;
  S.tut=0;S.tutDone=false;S.tutVer=2;S.lastDate=todayStr();S.lastSeen=now;
  recalcWater();ensureDaily();sv();
}

// change the colour scheme while playing
function applyUIPal(id){const was=curTheme();UIPAL.set(id);_bgCache.key='';_petBg=null;_stripSig='';renderStrip();drawTank();if(petUid!=null)renderPet(true);if(SND.music&&curTheme()!==was)startBGM();}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
ld();
if(window._freshGame)starterTank();
if(S.tutVer!==2){if(!S.tutDone)S.tutDone=true;S.tutVer=2;}// older saves already know the basics
const _awayMs=S.lastSeen?Date.now()-S.lastSeen:0;
lastTickTime=Date.now();
document.getElementById('CD').textContent='Coins: '+S.coins;
document.getElementById('LD').textContent='Lv. '+S.level;
updateSoundBtn();
updateTankBadge();updateClock();
buildHUD();renderShop();recalcWater();renderHUD();renderWaterBar();renderSetup();renderTut();updateQuestBadge();
buildHomes();buildExtras();applyHome();
setTimeout(drawTank,80);
setTimeout(()=>{if(_awayMs>0&&S.waterAdded)catchUp(_awayMs,true);else{if(_awayMs>0)catchUp(_awayMs);if(S.fish.length)openingFlow({ms:0});}},400);
setTimeout(gameLoop,500);
// redraw at the new width after rotation / resize
let _rsT=null;window.addEventListener('resize',()=>{clearTimeout(_rsT);_rsT=setTimeout(drawTank,200);});
// save when the app goes to the background so "time away" is accurate
document.addEventListener('visibilitychange',()=>{if(document.hidden)sv();});
</script>
